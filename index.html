  /* =====================================================================
     Verlauf (IndexedDB)
     ===================================================================== */
  const HISTORY_DB_NAME    = 'htmlEditorHistoryDB';
  const HISTORY_DB_VERSION = 1;
  const HISTORY_STORE      = 'versions';
  const HISTORY_MAX        = 20;

  let historyDbPromise = null;

  function openHistoryDB() {
    if (historyDbPromise) return historyDbPromise;
    historyDbPromise = new Promise((resolve, reject) => {
      let req;
      try {
        req = indexedDB.open(HISTORY_DB_NAME, HISTORY_DB_VERSION);
      } catch (e) {
        historyDbPromise = null;
        reject(e);
        return;
      }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(HISTORY_STORE)) {
          const store = db.createObjectStore(HISTORY_STORE, { keyPath: 'hash' });
          store.createIndex('timestamp', 'timestamp');
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => { historyDbPromise = null; reject(req.error); };
    });
    return historyDbPromise;
  }

  function hashString(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return (h >>> 0).toString(16);
  }

  function getDisplayName(text) {
    const m = /<title[^>]*>([\s\S]*?)<\/title>/i.exec(text);
    if (m) {
      const title = m[1].replace(/\s+/g, ' ').trim();
      if (title) return title;
    }
    const flat = text.replace(/\s+/g, ' ').trim();
    return flat.slice(0, 15) || '(leer)';
  }

  function formatTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const diff = Date.now() - ts;
    if (diff < 60000)      return 'gerade eben';
    if (diff < 3600000)    return 'vor ' + Math.floor(diff / 60000) + ' Min.';
    if (diff < 86400000)   return 'vor ' + Math.floor(diff / 3600000) + ' Std.';
    if (diff < 604800000)  return 'vor ' + Math.floor(diff / 86400000) + ' Tg.';
    return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) +
           ' ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  }

  async function addHistoryVersion(text) {
    if (!text || !text.trim()) return false;
    try {
      const db = await openHistoryDB();
      const hash        = hashString(text);
      const displayName = getDisplayName(text);
      const timestamp   = Date.now();
      const lines       = text.split('\n').length;
      const chars       = text.length;

      let wasInserted = false;

      await new Promise((resolve, reject) => {
        const tx = db.transaction(HISTORY_STORE, 'readwrite');
        const store = tx.objectStore(HISTORY_STORE);
        const getReq = store.get(hash);
        getReq.onsuccess = () => {
          const existing = getReq.result;
          if (existing) {
            existing.timestamp = timestamp;
            store.put(existing);
          } else {
            store.put({ hash, text, displayName, timestamp, lines, chars });
            wasInserted = true;
          }
        };
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
      });

      if (wasInserted) await trimHistory(db);
      return true;
    } catch (e) {
      console.error('Verlauf-Speichern fehlgeschlagen:', e);
      return false;
    }
  }

  async function trimHistory(db) {
    try {
      await new Promise((resolve, reject) => {
        const tx = db.transaction(HISTORY_STORE, 'readwrite');
        const store = tx.objectStore(HISTORY_STORE);
        const index = store.index('timestamp');
        const countReq = store.count();
        countReq.onsuccess = () => {
          const excess = countReq.result - HISTORY_MAX;
          if (excess <= 0) return;
          let deleted = 0;
          const cursorReq = index.openCursor();
          cursorReq.onsuccess = () => {
            const cursor = cursorReq.result;
            if (cursor && deleted < excess) {
              cursor.delete();
              deleted++;
              cursor.continue();
            }
          };
        };
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    } catch (e) {
      console.error('Verlauf-Trim fehlgeschlagen:', e);
    }
  }

  function getHistoryVersions() {
    return openHistoryDB().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction(HISTORY_STORE, 'readonly');
      const store = tx.objectStore(HISTORY_STORE);
      const index = store.index('timestamp');
      const req = index.openCursor(null, 'prev');
      const result = [];
      req.onsuccess = () => {
        const cursor = req.result;
        if (cursor) {
          result.push(cursor.value);
          cursor.continue();
        }
      };
      tx.oncomplete = () => resolve(result);
      tx.onerror = () => reject(tx.error);
    }));
  }

  async function refreshHistoryList() {
    const listEl = document.getElementById('historyList');
    if (!listEl) return;
    try {
      const versions = await getHistoryVersions();
      if (versions.length === 0) {
        listEl.innerHTML = '<div class="history-empty">Noch keine Versionen.<br>Speichere manuell oder öffne/einfüge eine Datei.</div>';
        return;
      }
      listEl.innerHTML = '';
      versions.forEach((v, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'history-item';
        btn.setAttribute('role', 'menuitem');

        const nameEl = document.createElement('span');
        nameEl.className = 'history-name';

        const numEl = document.createElement('span');
        numEl.className = 'version-num';
        numEl.textContent = 'Version ' + (idx + 1);
        nameEl.appendChild(numEl);

        const titleEl = document.createElement('span');
        titleEl.textContent = v.displayName || '(leer)';
        nameEl.appendChild(titleEl);

        const metaEl = document.createElement('span');
        metaEl.className = 'history-meta';
        metaEl.textContent =
          formatTime(v.timestamp) + ' · ' +
          (v.lines || 0).toLocaleString('de-DE') + ' Zeilen · ' +
          (v.chars || 0).toLocaleString('de-DE') + ' Zeichen';

        btn.appendChild(nameEl);
        btn.appendChild(metaEl);
        btn.addEventListener('click', () => loadHistoryVersion(v));

        listEl.appendChild(btn);
      });
    } catch (e) {
      console.error('Verlauf-Laden fehlgeschlagen:', e);
      listEl.innerHTML = '<div class="history-empty">Verlauf konnte nicht geladen werden.</div>';
    }
  }

  function loadHistoryVersion(v) {
    if (!v || typeof v.text !== 'string') return;
    commitUndoNow();
    setValue(v.text);
    lastKnownValue = v.text;
    closeAllDropdowns();
    toast('Version geladen');
  }

  /* =====================================================================
     Dropdown-Logik
     ===================================================================== */
  const dropdowns = Array.from(document.querySelectorAll('.dropdown'));

  function closeAllDropdowns(except) {
    dropdowns.forEach(dd => {
      if (dd !== except) {
        dd.classList.remove('open');
        dd.querySelector('.dropdown-toggle').setAttribute('aria-expanded', 'false');
      }
    });
  }

  dropdowns.forEach(dd => {
    const toggle = dd.querySelector('.dropdown-toggle');
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const willOpen = !dd.classList.contains('open');
      closeAllDropdowns(dd);
      dd.classList.toggle('open', willOpen);
      toggle.setAttribute('aria-expanded', String(willOpen));
      if (willOpen && dd.id === 'ddInfo') updateInfo();
      if (willOpen && dd.id === 'ddHistory') refreshHistoryList();
    });

    dd.querySelector('.dropdown-menu').addEventListener('click', (e) => {
      if (e.target.closest('button')) {
        closeAllDropdowns();
      }
    });
  });

  document.addEventListener('click', () => closeAllDropdowns());
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeAllDropdowns();
  });

  /* =====================================================================
     Toast
     ===================================================================== */
  let toastTimer;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1900);
  }

  /* =====================================================================
     Buttons
     ===================================================================== */
  document.getElementById('btnOpen').addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const f = fileInput.files && fileInput.files[0];
    if (f) loadFile(f);
    fileInput.value = '';
  });

  document.getElementById('btnCopy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(editor.value);
      toast('In Zwischenablage kopiert');
    } catch (e) {
      editor.focus();
      editor.select();
      try {
        document.execCommand('copy');
        toast('In Zwischenablage kopiert');
      } catch (err) {
        toast('Kopieren fehlgeschlagen');
      }
      editor.setSelectionRange(0, 0);
    }
  });

  async function pasteFromClipboard(replace) {
    try {
      const text = await navigator.clipboard.readText();
      if (text) {
        if (replace) {
          commitUndoNow();
          setValue(text);
          lastKnownValue = text;
          toast('Eingefügt (ersetzt)');
        } else {
          commitUndoNow();
          insertText(text);
          toast('Eingefügt');
        }
        await addHistoryVersion(editor.value);
        await refreshHistoryList();
      } else {
        toast('Zwischenablage ist leer');
      }
    } catch (e) {
      editor.focus();
      toast('Bitte Strg+V / ⌘+V im Editor nutzen');
    }
  }

  document.getElementById('btnPaste').addEventListener('click', () => pasteFromClipboard(false));
  document.getElementById('btnPasteReplace').addEventListener('click', () => pasteFromClipboard(true));

  document.getElementById('btnDownload').addEventListener('click', () => {
    const blob = new Blob([editor.value], { type: 'text/html;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = 'index.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast('Download gestartet');
  });

  document.getElementById('btnFormat').addEventListener('click', () => {
    const before = editor.value;
    if (!before.trim()) return;
    const after = formatDoc(before);
    if (after === before) { toast('Bereits formatiert'); return; }
    commitUndoNow();
    setValue(after);
    lastKnownValue = after;
    toast('Formatiert');
  });

  /* =====================================================================
     Auto-Grow für Such-/Ersetzen-Textareas
     ===================================================================== */
  function autoGrow(el) {
    el.style.height = 'auto';
    const h = Math.min(120, Math.max(34, el.scrollHeight));
    el.style.height = h + 'px';
  }

  findInput.addEventListener('input', () => autoGrow(findInput));
  replaceInput.addEventListener('input', () => autoGrow(replaceInput));

  document.getElementById('btnFind').addEventListener('click', () => {
    const open = findbar.hidden;
    findbar.hidden = !open;
    if (open) {
      const sel = editor.value.slice(editor.selectionStart, editor.selectionEnd);
      if (sel) findInput.value = sel;
      findInput.focus();
      findInput.select();
      autoGrow(findInput);
      autoGrow(replaceInput);
    }
  });

  document.getElementById('btnCloseFind').addEventListener('click', () => {
    findbar.hidden = true;
    editor.focus();
  });

  document.getElementById('btnFindNext').addEventListener('click', findNext);
  document.getElementById('btnReplace').addEventListener('click', replaceCurrent);
  document.getElementById('btnReplaceAll').addEventListener('click', replaceAll);

  findInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      findNext();
    }
  });
  replaceInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      replaceCurrent();
    }
  });

  /* =====================================================================
     Verlauf: Version Speichern
     ===================================================================== */
  document.getElementById('btnSaveVersion').addEventListener('click', async () => {
    const text = editor.value;
    if (!text || !text.trim()) {
      toast('Editor ist leer');
      return;
    }
    const ok = await addHistoryVersion(text);
    if (ok) {
      toast('Version gespeichert');
      await refreshHistoryList();
    } else {
      toast('Speichern fehlgeschlagen');
    }
  });

  /* =====================================================================
     Zeilennummern
     ===================================================================== */
  const btnLineNumbers = document.getElementById('btnLineNumbers');
  const lineNumberCheck = btnLineNumbers.querySelector('.check');

  function toggleLineNumbers() {
    showLineNumbers = !showLineNumbers;
    gutter.hidden = !showLineNumbers;
    btnLineNumbers.setAttribute('aria-checked', String(showLineNumbers));
    lineNumberCheck.hidden = !showLineNumbers;
    if (showLineNumbers) {
      updateLineNumbers();
      syncScroll();
    }
    saveAppOptions({ lineNumbers: showLineNumbers });
    toast(showLineNumbers ? 'Zeilennummern an' : 'Zeilennummern aus');
  }

  btnLineNumbers.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleLineNumbers();
    closeAllDropdowns();
  });

  /* =====================================================================
     Suchen & Ersetzen
     ===================================================================== */
  function scrollToIndex(idx) {
    const before = editor.value.slice(0, idx);
    const line = (before.match(/\n/g) || []).length;
    const cs = getComputedStyle(editor);
    const lh = parseFloat(cs.lineHeight) || (parseFloat(cs.fontSize) || 14) * 1.55;
    const target = line * lh - editor.clientHeight / 2 + lh;
    editor.scrollTop = Math.max(0, target);
    syncScroll();
  }

  function findNext() {
    const q = findInput.value;
    if (!q) { findInput.focus(); return; }
    const hay = editor.value.toLowerCase();
    const needle = q.toLowerCase();
    let idx = hay.indexOf(needle, editor.selectionEnd);
    if (idx === -1) idx = hay.indexOf(needle, 0);
    if (idx === -1) { toast('Nicht gefunden'); return; }
    editor.focus();
    editor.setSelectionRange(idx, idx + q.length);
    scrollToIndex(idx);
  }

  function replaceCurrent() {
    const q = findInput.value;
    if (!q) { findInput.focus(); return; }
    const sel = editor.value.slice(editor.selectionStart, editor.selectionEnd);
    if (sel.toLowerCase() === q.toLowerCase()) {
      editor.focus();
      let ok = false;
      try { ok = document.execCommand('insertText', false, replaceInput.value); } catch (e) { ok = false; }
      if (!ok) {
        const s = editor.selectionStart;
        editor.value = editor.value.slice(0, s) + replaceInput.value +
                       editor.value.slice(editor.selectionEnd);
        editor.setSelectionRange(s + replaceInput.value.length, s + replaceInput.value.length);
      }
      updateHighlight();
    }
    findNext();
  }

  function replaceAll() {
    const q = findInput.value;
    if (!q) { findInput.focus(); return; }
    const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(escaped, 'gi');
    const before = editor.value;
    const matches = before.match(re);
    if (!matches) { toast('Nicht gefunden'); return; }
    const after = before.replace(re, () => replaceInput.value);
    commitUndoNow();
    setValue(after);
    lastKnownValue = after;
    toast(matches.length + ' Ersetzung' + (matches.length === 1 ? '' : 'en'));
  }

  /* =====================================================================
     Datei laden / Drag & Drop
     ===================================================================== */
  function loadFile(file) {
    const reader = new FileReader();
    reader.onload = async () => {
      commitUndoNow();
      setValue(String(reader.result));
      lastKnownValue = editor.value;
      toast('Geladen: ' + file.name);
      await addHistoryVersion(editor.value);
      await refreshHistoryList();
    };
    reader.onerror = () => toast('Datei konnte nicht gelesen werden');
    reader.readAsText(file);
  }

  let dragCounter = 0;

  document.addEventListener('dragenter', e => {
    if (!e.dataTransfer) return;
    const types = Array.from(e.dataTransfer.types || []);
    if (types.indexOf('Files') === -1) return;
    e.preventDefault();
    dragCounter++;
    dropOverlay.classList.add('show');
  });

  document.addEventListener('dragover', e => e.preventDefault());

  document.addEventListener('dragleave', () => {
    dragCounter--;
    if (dragCounter <= 0) { dragCounter = 0; dropOverlay.classList.remove('show'); }
  });

  document.addEventListener('drop', async e => {
    e.preventDefault();
    dragCounter = 0;
    dropOverlay.classList.remove('show');
    if (!e.dataTransfer) return;
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) { loadFile(f); return; }
    const text = e.dataTransfer.getData('text/plain');
    if (text) {
      commitUndoNow();
      insertText(text);
      toast('Text eingefügt');
      await addHistoryVersion(editor.value);
      await refreshHistoryList();
    }
  });

  /* =====================================================================
     Editor-Events
     ===================================================================== */
  editor.addEventListener('input', () => {
    updateHighlight();
    scheduleUndoCommit();
  });
  editor.addEventListener('scroll', syncScroll, { passive: true });

  editor.addEventListener('keydown', e => {
    if (e.key === 'Tab') {
      e.preventDefault();
      insertText('  ');
      return;
    }
    // Undo / Redo
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.key === 'z' || e.key === 'Z')) {
      e.preventDefault();
      performUndo();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'z' || e.key === 'Z')) {
      e.preventDefault();
      performRedo();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.key === 'y' || e.key === 'Y')) {
      e.preventDefault();
      performRedo();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'f' || e.key === 'F')) {
      e.preventDefault();
      document.getElementById('btnFind').click();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
      e.preventDefault();
      document.getElementById('btnDownload').click();
      return;
    }
    if (e.key === 'Escape' && !findbar.hidden) {
      findbar.hidden = true;
      editor.focus();
    }
  });

  window.addEventListener('resize', syncScroll);

  document.getElementById('btnShare').addEventListener('click', async () => {
    const fileName = 'index.html';
    const blob = new Blob([editor.value], { type: 'text/html;charset=utf-8' });
    const file = new File([blob], fileName, { type: 'text/html' });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file] });
        toast('Teilen-Menü geöffnet');
      } catch (err) {
        if (err.name !== 'AbortError') {
          console.error('Teilen fehlgeschlagen:', err);
          toast('Teilen fehlgeschlagen – nutze Download');
          document.getElementById('btnDownload').click();
        }
      }
    } else {
      toast('Teilen wird hier nicht unterstützt – Download gestartet');
      document.getElementById('btnDownload').click();
    }
  });

  /* =====================================================================
     Persistente Optionen beim Start anwenden
     ===================================================================== */
  (function applyInitialOptions() {
    if (showLineNumbers) {
      gutter.hidden = false;
      const btn = document.getElementById('btnLineNumbers');
      btn.setAttribute('aria-checked', 'true');
      btn.querySelector('.check').hidden = false;
    }

    if (showMinimap) {
      minimap.hidden = false;
      const btn = document.getElementById('btnMinimap');
      btn.setAttribute('aria-checked', 'true');
      document.getElementById('mmCheck').hidden = false;
      requestAnimationFrame(() => {
        drawMinimap();
        updateMinimapViewport();
      });
    }
  })();

  updateInfo();

})();
</script>

<script>
/* =====================================================================
   PWA: Service-Worker-Registrierung + Install-Prompt
   ===================================================================== */
(function () {
  'use strict';

  if (!('serviceWorker' in navigator)) return;

  /* --- Service Worker registrieren (erst nach load, damit die Seite
         beim ersten Besuch nicht ausgebremst wird) --- */
  window.addEventListener('load', () => {
    navigator.serviceWorker
      .register('sw.js', { scope: './' })
      .then((reg) => {
        // Auf Updates prüfen
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', () => {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              // Neue Version bereit – sanfter Hinweis
              showPwaToast('Neue Version verfügbar – bitte Seite neu laden.');
            }
          });
        });
      })
      .catch((err) => {
        console.warn('Service-Worker-Registrierung fehlgeschlagen:', err);
      });
  });

  /* --- Installations-Prompt (Chrome / Edge / Android) --- */
  let deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;

    // Schwebenden „Installieren"-Button anzeigen
    if (!document.getElementById('pwaInstallBtn')) {
      const btn = document.createElement('button');
      btn.id = 'pwaInstallBtn';
      btn.type = 'button';
      btn.title = 'Editor als App installieren';
      btn.setAttribute('aria-label', 'Editor als App installieren');
      btn.innerHTML = '<i class="bi bi-download" aria-hidden="true"></i> App installieren';
      Object.assign(btn.style, {
        position: 'fixed',
        right: '16px',
        bottom: '16px',
        zIndex: '150',
        display: 'inline-flex',
        alignItems: 'center',
        gap: '8px',
        padding: '10px 14px',
        font: 'inherit',
        fontSize: '13.5px',
        color: '#0f1116',
        background: '#7ee787',
        border: '0',
        borderRadius: '8px',
        cursor: 'pointer',
        boxShadow: '0 6px 20px rgba(0,0,0,.35)'
      });

      btn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        try {
          await deferredPrompt.userChoice;
        } catch (e) { /* ignore */ }
        deferredPrompt = null;
        btn.remove();
      });

      document.body.appendChild(btn);
    }
  });

  window.addEventListener('appinstalled', () => {
    const btn = document.getElementById('pwaInstallBtn');
    if (btn) btn.remove();
    showPwaToast('Editor wurde installiert.');
  });

  /* --- Kleiner Toast-Helper (nutzt den bestehenden #toast, falls vorhanden) --- */
  function showPwaToast(msg) {
    const existing = document.getElementById('toast');
    if (existing) {
      existing.textContent = msg;
      existing.classList.add('show');
      clearTimeout(showPwaToast._t);
      showPwaToast._t = setTimeout(() => existing.classList.remove('show'), 2600);
    } else {
      console.log('[PWA]', msg);
    }
  }
})();
</script>
