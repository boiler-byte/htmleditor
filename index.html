<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HTML Editor</title>
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: #0f1116;
    color: #d7dce5;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
  }

  /* ---------- Toolbar ---------- */
  .toolbar, .findbar {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px;
    background: #151821;
    border-bottom: 1px solid #232833;
  }

  /* ---------- Dropdown ---------- */
  .dropdown {
    position: relative;
    display: inline-block;
  }
  .dropdown-toggle {
    -webkit-tap-highlight-color: transparent;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    font-size: 14px;
    padding: 7px 12px;
    min-height: 36px;
    color: #cfd6e4;
    background: #1d2230;
    border: 1px solid #2b3242;
    border-radius: 7px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    line-height: 1;
  }
  .dropdown-toggle i { font-size: 1.15rem; line-height: 1; }
  .dropdown-toggle .caret { font-size: 0.75rem; margin-left: 2px; opacity: 0.7; }
  .dropdown-toggle:hover  { background: #262d3e; }
  .dropdown-toggle:active { background: #323b50; }

  .dropdown-menu {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    min-width: 220px;
    background: #1d2230;
    border: 1px solid #2b3242;
    border-radius: 8px;
    padding: 5px;
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
    z-index: 50;
    display: none;
  }
  .dropdown.open .dropdown-menu { display: block; }

  .dropdown-menu button {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    font: inherit;
    font-size: 13.5px;
    text-align: left;
    padding: 8px 10px;
    color: #cfd6e4;
    background: transparent;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    line-height: 1;
    min-height: 34px;
  }
  .dropdown-menu button i { font-size: 1.05rem; width: 20px; text-align: center; }
  .dropdown-menu button:hover { background: #2a3142; }
  .dropdown-menu button .check {
    margin-left: auto;
    color: #7ee787;
    font-size: 1rem;
  }
  .dropdown-menu .sep {
    height: 1px;
    background: #2b3242;
    margin: 5px 4px;
  }

  /* ---------- Suchleiste ---------- */
  .findbar input {
    flex: 1 1 130px;
    min-width: 0;
    padding: 7px 9px;
    font: inherit;
    font-size: 13px;
    color: #d7dce5;
    background: #0e1117;
    border: 1px solid #2b3242;
    border-radius: 7px;
    outline: none;
  }
  .findbar input:focus { border-color: #3b82f6; }
  .findbar button {
    -webkit-tap-highlight-color: transparent;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font: inherit;
    font-size: 14px;
    padding: 6px 8px;
    min-width: 36px;
    min-height: 34px;
    color: #cfd6e4;
    background: #1d2230;
    border: 1px solid #2b3242;
    border-radius: 7px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    line-height: 1;
  }
  .findbar button i { font-size: 1.05rem; line-height: 1; }
  .findbar button:hover { background: #262d3e; }

  /* ---------- Editor ---------- */
  .editor-wrap {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    background: #0f1116;
    display: flex;
  }

  /* Zeilennummern */
  .gutter {
    flex: 0 0 auto;
    width: 48px;
    overflow: hidden;
    background: #0c0e13;
    border-right: 1px solid #232833;
    position: relative;
    z-index: 2;
  }
  .gutter pre {
    margin: 0;
    padding: 12px 8px 48px;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 14px;
    line-height: 1.55;
    text-align: right;
    color: #4b5566;
    white-space: pre;
    user-select: none;
    pointer-events: none;
  }

  .code-area {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
  }

  .code-area pre,
  .code-area textarea {
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 12px 12px 48px;
    border: 0;
    outline: 0;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 14px;
    line-height: 1.55;
    letter-spacing: 0;
    tab-size: 2;
    -moz-tab-size: 2;
    white-space: pre;
    overflow-wrap: normal;
    word-break: normal;
  }

  .code-area pre {
    overflow: hidden;
    pointer-events: none;
    color: #d7dce5;
    z-index: 0;
  }

  .code-area textarea {
    overflow: auto;
    resize: none;
    background: transparent;
    color: transparent;
    -webkit-text-fill-color: transparent;
    caret-color: #7ee787;
    z-index: 1;
  }
  .code-area textarea::selection      { background: rgba(88,140,255,.35); }
  .code-area textarea::-moz-selection { background: rgba(88,140,255,.35); }

  /* ---------- Token-Farben ---------- */
  .t-comment { color: #6e7681; font-style: italic; }
  .t-tag     { color: #7ee787; }
  .t-attr    { color: #79c0ff; }
  .t-str     { color: #a5d6ff; }
  .t-punct   { color: #7d8590; }
  .t-meta    { color: #7d8590; }
  .t-kw      { color: #ff7b72; }
  .t-num     { color: #79c0ff; }
  .t-sel     { color: #d2a8ff; }
  .t-prop    { color: #79c0ff; }
  .t-val     { color: #c9d1d9; }
  .t-id      { color: #e6edf3; }
  .t-op      { color: #8b949e; }

  /* ---------- Drag & Drop Overlay ---------- */
  .drop-overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(10, 14, 22, .82);
    border: 3px dashed #3b82f6;
    color: #93c5fd;
    font-size: 18px;
    font-weight: 600;
    z-index: 100;
    pointer-events: none;
    text-align: center;
    padding: 20px;
  }
  .drop-overlay.show { display: flex; }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translate(-50%, 20px);
    background: #1d2433;
    color: #e6edf3;
    border: 1px solid #2f3a4d;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 200;
    max-width: 90vw;
    text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Mobile ---------- */
  @media (max-width: 640px) {
    .code-area pre,
    .code-area textarea,
    .gutter pre { font-size: 16px; }
    .dropdown-toggle { padding: 8px 10px; }
    .gutter { width: 42px; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <!-- Dropdown: Datei -->
  <div class="dropdown" id="ddFile">
    <button class="dropdown-toggle" id="ddFileToggle" aria-haspopup="true" aria-expanded="false">
      <i class="bi bi-folder2-open" aria-hidden="true"></i>
      <span>Datei</span>
      <i class="bi bi-chevron-down caret" aria-hidden="true"></i>
    </button>
    <div class="dropdown-menu" role="menu" aria-labelledby="ddFileToggle">
      <button id="btnOpen" role="menuitem">
        <i class="bi bi-folder2-open" aria-hidden="true"></i>
        <span>Datei öffnen</span>
      </button>
      <button id="btnPaste" role="menuitem">
        <i class="bi bi-clipboard-plus" aria-hidden="true"></i>
        <span>Einfügen</span>
      </button>
      <button id="btnPasteReplace" role="menuitem">
        <i class="bi bi-arrow-left-right" aria-hidden="true"></i>
        <span>Einfügen &amp; Ersetzen</span>
      </button>
      <button id="btnCopy" role="menuitem">
        <i class="bi bi-clipboard" aria-hidden="true"></i>
        <span>Kopieren</span>
      </button>
      <div class="sep" role="separator"></div>
      <button id="btnDownload" role="menuitem">
        <i class="bi bi-download" aria-hidden="true"></i>
        <span>Download</span>
      </button>
      <button id="btnShare" role="menuitem">
        <i class="bi bi-share" aria-hidden="true"></i>
        <span>Teilen</span>
      </button>
    </div>
  </div>

  <!-- Dropdown: Bearbeiten -->
  <div class="dropdown" id="ddEdit">
    <button class="dropdown-toggle" id="ddEditToggle" aria-haspopup="true" aria-expanded="false">
      <i class="bi bi-pencil-square" aria-hidden="true"></i>
      <span>Bearbeiten</span>
      <i class="bi bi-chevron-down caret" aria-hidden="true"></i>
    </button>
    <div class="dropdown-menu" role="menu" aria-labelledby="ddEditToggle">
      <button id="btnFind" role="menuitem">
        <i class="bi bi-search" aria-hidden="true"></i>
        <span>Suchen/Ersetzen</span>
      </button>
      <button id="btnFormat" role="menuitem">
        <i class="bi bi-magic" aria-hidden="true"></i>
        <span>Formatieren</span>
      </button>
      <div class="sep" role="separator"></div>
      <button id="btnLineNumbers" role="menuitemcheckbox" aria-checked="false">
        <i class="bi bi-list-ol" aria-hidden="true"></i>
        <span>Zeilennummern anzeigen</span>
        <i class="bi bi-check-lg check" hidden aria-hidden="true"></i>
      </button>
    </div>
  </div>
</div>

<div class="findbar" id="findbar" hidden>
  <input id="findInput" type="text" placeholder="Suchen …" autocomplete="off" spellcheck="false">
  <input id="replaceInput" type="text" placeholder="Ersetzen …" autocomplete="off" spellcheck="false">
  <button id="btnFindNext" title="Nächster Treffer" aria-label="Nächster Treffer">
    <i class="bi bi-arrow-down" aria-hidden="true"></i> Finden
  </button>
  <button id="btnReplace" title="Ersetzen" aria-label="Ersetzen">
    <i class="bi bi-arrow-repeat" aria-hidden="true"></i> Ersetzen
  </button>
  <button id="btnReplaceAll" title="Alle ersetzen" aria-label="Alle ersetzen">
    <i class="bi bi-check2-all" aria-hidden="true"></i> Alle Ersetzen
  </button>
  <button id="btnCloseFind" title="Schließen" aria-label="Schließen">
    <i class="bi bi-x-lg" aria-hidden="true"></i>
  </button>
</div>

<div class="editor-wrap" id="editorWrap">
  <div class="gutter" id="gutter" hidden>
    <pre id="lineNumbers" aria-hidden="true"></pre>
  </div>
  <div class="code-area" id="codeArea">
    <pre id="hl" aria-hidden="true"></pre>
    <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="Code-Editor"></textarea>
  </div>
</div>

<input type="file" id="fileInput" accept=".html,.htm,.css,.js,.txt,text/*" hidden>
<div class="drop-overlay" id="dropOverlay">Datei hier ablegen</div>
<div id="toast"></div>

<script>
(function () {
  'use strict';

  /* =====================================================================
     Hilfsfunktionen
     ===================================================================== */
  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function sp(cls, text) {
    return '<span class="t-' + cls + '">' + esc(text) + '</span>';
  }

  /* =====================================================================
     Syntax-Highlighting: CSS
     ===================================================================== */
  const CSS_RE = /\/\*[\s\S]*?\*\/|"(?:\\[\s\S]|[^"\\])*"|'(?:\\[\s\S]|[^'\\])*'|#[0-9a-fA-F]{3,8}\b|@[-\w]+|[{}:;(),]|\d+(?:\.\d+)?(?:[a-z%]+)?|[.#][-\w]+|[-\w]+/g;

  function highlightCSS(code) {
    let out = '', pos = 0, m;
    CSS_RE.lastIndex = 0;
    while ((m = CSS_RE.exec(code))) {
      if (m.index > pos) out += esc(code.slice(pos, m.index));
      const t = m[0];
      let cls;
      if (t.charCodeAt(0) === 47 && t[1] === '*')          cls = 'comment';
      else if (t[0] === '"' || t[0] === "'")               cls = 'str';
      else if (t[0] === '@')                               cls = 'kw';
      else if (t[0] === '#' && t.length > 1 && /^#[0-9a-fA-F]{3,8}$/.test(t)) cls = 'num';
      else if ((t[0] === '.' || t[0] === '#') && t.length > 1) cls = 'sel';
      else if (t.length === 1 && '{}:;(),'.indexOf(t) !== -1)  cls = 'punct';
      else if (/^\d/.test(t))                              cls = 'num';
      else cls = /^\s*:/.test(code.slice(m.index + t.length)) ? 'prop' : 'val';
      out += sp(cls, t);
      pos = m.index + t.length;
    }
    if (pos < code.length) out += esc(code.slice(pos));
    return out;
  }

  /* =====================================================================
     Syntax-Highlighting: JavaScript
     ===================================================================== */
  const JS_KEYWORDS = new Set((
    'const let var function return if else for while do switch case default break continue ' +
    'new class extends super this typeof instanceof in of delete void try catch finally throw ' +
    'async await yield import export from null undefined true false NaN Infinity static get set'
  ).split(' '));

  const JS_RE = /\/\/[^\n]*|\/\*[\s\S]*?\*\/|`(?:\\[\s\S]|[^`\\])*`|"(?:\\[\s\S]|[^"\\\n])*"|'(?:\\[\s\S]|[^'\\\n])*'|\d+(?:\.\d+)?(?:e[+-]?\d+)?|[A-Za-z_$][\w$]*|[{}()[\];,.]|[+\-*/%=<>!&|^~?:]+/g;

  function highlightJS(code) {
    let out = '', pos = 0, m;
    JS_RE.lastIndex = 0;
    while ((m = JS_RE.exec(code))) {
      if (m.index > pos) out += esc(code.slice(pos, m.index));
      const t = m[0];
      let cls;
      if (t[0] === '/' && (t[1] === '/' || t[1] === '*'))     cls = 'comment';
      else if (t[0] === '"' || t[0] === "'" || t[0] === '`')  cls = 'str';
      else if (/^\d/.test(t))                                 cls = 'num';
      else if (/^[A-Za-z_$]/.test(t))                         cls = JS_KEYWORDS.has(t) ? 'kw' : 'id';
      else if (t.length === 1 && '{}()[];,.:'.indexOf(t) !== -1) cls = 'punct';
      else cls = 'op';
      out += sp(cls, t);
      pos = m.index + t.length;
    }
    if (pos < code.length) out += esc(code.slice(pos));
    return out;
  }

  /* =====================================================================
     Syntax-Highlighting: HTML (mit eingebettetem CSS/JS)
     ===================================================================== */
  function colorizeTag(tag) {
    let out = '', i = 0;
    const n = tag.length;

    if (tag.startsWith('</')) { out += sp('punct', '</'); i = 2; }
    else                      { out += sp('punct', '<');  i = 1; }

    const m = /^[a-zA-Z][\w:-]*/.exec(tag.slice(i));
    if (m) { out += sp('tag', m[0]); i += m[0].length; }

    while (i < n) {
      const c = tag[i];
      if (c === '>')       { out += sp('punct', '>'); i++; }
      else if (c === '/')  { out += sp('punct', '/'); i++; }
      else if (c === '=')  { out += sp('punct', '='); i++; }
      else if (c === '"' || c === "'") {
        const e = tag.indexOf(c, i + 1);
        const end = e === -1 ? n : e + 1;
        out += sp('str', tag.slice(i, end));
        i = end;
      }
      else if (/\s/.test(c)) { out += esc(c); i++; }
      else {
        let j = i;
        while (j < n && !/[\s=>"'\/]/.test(tag[j])) j++;
        if (j === i) j = i + 1;
        out += sp('attr', tag.slice(i, j));
        i = j;
      }
    }
    return out;
  }

  function highlightHTML(code) {
    let out = '', i = 0;
    const n = code.length;

    while (i < n) {
      const lt = code.indexOf('<', i);
      if (lt === -1) { out += esc(code.slice(i)); break; }
      if (lt > i) out += esc(code.slice(i, lt));

      /* Kommentar */
      if (code.startsWith('<!--', lt)) {
        const e = code.indexOf('-->', lt + 4);
        const end = e === -1 ? n : e + 3;
        out += sp('comment', code.slice(lt, end));
        i = end;
        continue;
      }

      /* Doctype / <! ... > */
      if (code.startsWith('<!', lt)) {
        const e = code.indexOf('>', lt);
        const end = e === -1 ? n : e + 1;
        out += sp('meta', code.slice(lt, end));
        i = end;
        continue;
      }

      /* Tag-Anfang */
      const m = /^<(\/?)([a-zA-Z][\w:-]*)/.exec(code.slice(lt, lt + 200));
      if (!m) { out += esc('<'); i = lt + 1; continue; }

      /* Tag-Ende suchen (Anführungszeichen beachten) */
      let j = lt + m[0].length, q = null, end = -1;
      while (j < n) {
        const c = code[j];
        if (q) { if (c === q) q = null; }
        else if (c === '"' || c === "'") q = c;
        else if (c === '>') { end = j; break; }
        j++;
      }
      if (end === -1) { out += esc(code.slice(lt)); break; }

      out += colorizeTag(code.slice(lt, end + 1));
      i = end + 1;

      /* Eingebettetes <style> / <script> */
      const name = m[2].toLowerCase();
      if (!m[1] && (name === 'style' || name === 'script')) {
        const rest = code.slice(i);
        const cm = new RegExp('</' + name + '\\s*>', 'i').exec(rest);
        const inner = cm ? rest.slice(0, cm.index) : rest;
        out += (name === 'style') ? highlightCSS(inner) : highlightJS(inner);
        i += inner.length;
      }
    }
    return out;
  }

  /* Automatische Spracherkennung */
  function highlight(code) {
    const t = code.trim();
    if (t && t.indexOf('<') === -1) {
      if (/\b(function|const|let|var|return)\b|=>/.test(t)) return highlightJS(code);
      if (/[{}]/.test(t) && t.indexOf(':') !== -1)          return highlightCSS(code);
      return highlightJS(code);
    }
    return highlightHTML(code);
  }

  /* =====================================================================
     Pretty-Format: CSS
     ===================================================================== */
  function formatCSS(src) {
    let out = '', indent = 0, i = 0;
    const n = src.length;
    let atLineStart = true;

    const pad  = () => '  '.repeat(indent);
    const write = (s) => { if (atLineStart) { out += pad(); atLineStart = false; } out += s; };
    const nl    = () => { out = out.replace(/[ \t]+$/, '') + '\n'; atLineStart = true; };

    while (i < n) {
      const c = src[i];

      if (c === '/' && src[i + 1] === '*') {
        const e = src.indexOf('*/', i + 2);
        const end = e === -1 ? n : e + 2;
        write(src.slice(i, end)); nl(); i = end; continue;
      }
      if (c === '"' || c === "'") {
        let j = i + 1;
        while (j < n && src[j] !== c) { if (src[j] === '\\') j++; j++; }
        write(src.slice(i, j + 1)); i = j + 1; continue;
      }
      if (/\s/.test(c)) {
        let j = i;
        while (j < n && /\s/.test(src[j])) j++;
        if (j < n && '{};,'.indexOf(src[j]) === -1 && !atLineStart) write(' ');
        i = j; continue;
      }
      if (c === '{') { write(' {'); nl(); indent++; i++; continue; }
      if (c === '}') { nl(); indent = Math.max(0, indent - 1); write('}'); nl(); i++; continue; }
      if (c === ';') { write(';'); nl(); i++; continue; }

      write(c);
      i++;
    }
    return out.replace(/\n{3,}/g, '\n\n').trim();
  }

  /* =====================================================================
     Pretty-Format: JavaScript
     ===================================================================== */
  function formatJS(src) {
    let out = '', indent = 0, i = 0, paren = 0;
    const n = src.length;
    let atLineStart = true;

    const pad   = () => '  '.repeat(indent);
    const write = (s) => { if (atLineStart) { out += pad(); atLineStart = false; } out += s; };
    const nl    = () => { out = out.replace(/[ \t]+$/, '') + '\n'; atLineStart = true; };

    while (i < n) {
      const c = src[i];

      if (c === '/' && src[i + 1] === '/') {
        let j = src.indexOf('\n', i);
        if (j === -1) j = n;
        write(src.slice(i, j)); nl(); i = j; continue;
      }
      if (c === '/' && src[i + 1] === '*') {
        const e = src.indexOf('*/', i + 2);
        const end = e === -1 ? n : e + 2;
        write(src.slice(i, end)); nl(); i = end; continue;
      }
      if (c === '"' || c === "'" || c === '`') {
        let j = i + 1;
        while (j < n && src[j] !== c) { if (src[j] === '\\') j++; j++; }
        write(src.slice(i, j + 1)); i = j + 1; continue;
      }
      if (/\s/.test(c)) {
        let j = i;
        while (j < n && /\s/.test(src[j])) j++;
        if (j < n && '};,)].'.indexOf(src[j]) === -1 && !atLineStart) write(' ');
        i = j; continue;
      }
      if (c === '(') { paren++; write('('); i++; continue; }
      if (c === ')') { paren = Math.max(0, paren - 1); write(')'); i++; continue; }

      if (c === '{') { write(' {'); nl(); indent++; i++; continue; }

      if (c === '}') {
        nl();
        indent = Math.max(0, indent - 1);
        write('}');
        /* Folgt direkt etwas Anhängendes? */
        let j = i + 1;
        while (j < n && /[ \t]/.test(src[j])) j++;
        const nx = src[j];
        const tail = src.slice(j, j + 8);
        if (nx === ';' || nx === ',' || nx === ')' || nx === ']' || nx === '.' || nx === '(') {
          /* gleiche Zeile weiter */
        } else if (/^(else|catch|finally)\b/.test(tail)) {
          write(' ');
        } else {
          nl();
        }
        i++;
        continue;
      }

      if (c === ';' && paren === 0) { write(';'); nl(); i++; continue; }

      write(c);
      i++;
    }
    return out.replace(/\n{3,}/g, '\n\n').trim();
  }

  /* =====================================================================
     Pretty-Format: HTML
     ===================================================================== */
  const VOID_TAGS = new Set('area base br col embed hr img input link meta param source track wbr'.split(' '));

  function collapseTag(t) {
    let out = '', q = null;
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (q) { out += c; if (c === q) q = null; }
      else if (c === '"' || c === "'") { q = c; out += c; }
      else if (c === '>') { out = out.replace(/\s+$/, '') + '>'; }
      else if (/\s/.test(c)) { if (!/\s$/.test(out)) out += ' '; }
      else out += c;
    }
    return out.trim();
  }

  function formatHTML(src) {
    const out = [];
    let indent = 0, i = 0;
    const n = src.length;
    const pad  = () => '  '.repeat(indent);
    const push = (s) => out.push(pad() + s);

    while (i < n) {
      const lt = src.indexOf('<', i);
      if (lt === -1) {
        const text = src.slice(i).trim();
        if (text) push(text);
        break;
      }
      if (lt > i) {
        const text = src.slice(i, lt).trim();
        if (text) push(text);
      }

      /* Kommentar */
      if (src.startsWith('<!--', lt)) {
        const e = src.indexOf('-->', lt);
        const end = e === -1 ? n : e + 3;
        push(collapseTag(src.slice(lt, end)));
        i = end; continue;
      }
      /* Doctype / <! ... > */
      if (src.startsWith('<!', lt)) {
        const e = src.indexOf('>', lt);
        const end = e === -1 ? n : e + 1;
        push(collapseTag(src.slice(lt, end)));
        i = end; continue;
      }

      /* Tag-Ende suchen */
      let j = lt + 1, q = null, end = -1;
      while (j < n) {
        const c = src[j];
        if (q) { if (c === q) q = null; }
        else if (c === '"' || c === "'") q = c;
        else if (c === '>') { end = j; break; }
        j++;
      }
      if (end === -1) {
        const rest = src.slice(lt).trim();
        if (rest) push(rest);
        break;
      }

      const raw = src.slice(lt, end + 1);
      const tm = /^<(\/?)([a-zA-Z][\w:-]*)/.exec(raw);
      if (!tm) { push(collapseTag(raw)); i = end + 1; continue; }

      const closing   = tm[1] === '/';
      const name      = tm[2].toLowerCase();
      const selfClose = /\/>$/.test(raw) || VOID_TAGS.has(name);

      if (closing) {
        indent = Math.max(0, indent - 1);
        push(collapseTag(raw));
        i = end + 1;
        continue;
      }

      push(collapseTag(raw));
      i = end + 1;

      /* <style> / <script> Inhalt */
      if (name === 'style' || name === 'script') {
        const cm = new RegExp('</' + name + '\\s*>', 'i').exec(src.slice(i));
        const inner = cm ? src.slice(i, i + cm.index) : src.slice(i);
        const formatted = (name === 'style') ? formatCSS(inner) : formatJS(inner);
        if (formatted.trim()) {
          indent++;
          formatted.split('\n').forEach(line => {
            out.push(line.trim() ? pad() + line : '');
          });
          indent--;
        }
        i += inner.length;
        continue;
      }

      if (!selfClose) indent++;
    }

    return out.join('\n');
  }

  function formatDoc(src) {
    const t = src.trim();
    if (!t) return src;
    if (t.indexOf('<') !== -1) return formatHTML(src);
    if (/\b(function|const|let|var|return)\b|=>/.test(t)) return formatJS(src);
    if (/\{[\s\S]*:[\s\S]*\}/.test(t)) return formatCSS(src);
    return formatJS(src);
  }

  /* =====================================================================
     Editor-Aufbau
     ===================================================================== */
  const editor       = document.getElementById('editor');
  const hlEl         = document.getElementById('hl');
  const editorWrap   = document.getElementById('editorWrap');
  const findbar      = document.getElementById('findbar');
  const findInput    = document.getElementById('findInput');
  const replaceInput = document.getElementById('replaceInput');
  const fileInput    = document.getElementById('fileInput');
  const dropOverlay  = document.getElementById('dropOverlay');
  const gutter       = document.getElementById('gutter');
  const lineNumbers  = document.getElementById('lineNumbers');

  let rafPending = false;
  let showLineNumbers = false;

  function syncScroll() {
    hlEl.scrollTop  = editor.scrollTop;
    hlEl.scrollLeft = editor.scrollLeft;
    if (showLineNumbers) {
      lineNumbers.scrollTop = editor.scrollTop;
    }
  }

  function updateLineNumbers() {
    if (!showLineNumbers) return;
    const count = editor.value.split('\n').length;
    let s = '';
    for (let i = 1; i <= count; i++) s += i + '\n';
    lineNumbers.textContent = s;
    lineNumbers.scrollTop = editor.scrollTop;
  }

  function updateHighlight() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => {
      rafPending = false;
      hlEl.innerHTML = highlight(editor.value) + '\n';
      if (showLineNumbers) updateLineNumbers();
      syncScroll();
    });
  }

  function setValue(text) {
    editor.value = text;
    editor.scrollTop = 0;
    editor.scrollLeft = 0;
    editor.setSelectionRange(0, 0);
    updateHighlight();
  }

  function insertText(text) {
    editor.focus();
    let ok = false;
    try { ok = document.execCommand('insertText', false, text); } catch (e) { ok = false; }
    if (!ok) {
      const s = editor.selectionStart, e = editor.selectionEnd;
      editor.value = editor.value.slice(0, s) + text + editor.value.slice(e);
      editor.setSelectionRange(s + text.length, s + text.length);
    }
    updateHighlight();
  }

  /* =====================================================================
     Dropdown-Logik
     ===================================================================== */
  const dropdowns = Array.from(document.querySelectorAll('.dropdown'));

  function closeAllDropdowns(except) {
    dropdowns.forEach(dd => {
      if (dd !== except) {
        dd.classList.remove('open');
        dd.querySelector('.dropdown-toggle').setAttribute('aria-expanded', 'false');
      }
    });
  }

  dropdowns.forEach(dd => {
    const toggle = dd.querySelector('.dropdown-toggle');
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const willOpen = !dd.classList.contains('open');
      closeAllDropdowns(dd);
      dd.classList.toggle('open', willOpen);
      toggle.setAttribute('aria-expanded', String(willOpen));
    });

    // Klicks im Menü schließen es (außer bei verschachtelten Aktionen)
    dd.querySelector('.dropdown-menu').addEventListener('click', (e) => {
      // Wenn auf einen Menüpunkt geklickt wurde, schließen
      if (e.target.closest('button')) {
        closeAllDropdowns();
      }
    });
  });

  // Klick außerhalb schließt Dropdowns
  document.addEventListener('click', () => closeAllDropdowns());

  // Escape schließt Dropdowns
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeAllDropdowns();
  });

  /* =====================================================================
     Toast
     ===================================================================== */
  let toastTimer;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1900);
  }

  /* =====================================================================
     Buttons
     ===================================================================== */
  document.getElementById('btnOpen').addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const f = fileInput.files && fileInput.files[0];
    if (f) loadFile(f);
    fileInput.value = '';
  });

  document.getElementById('btnCopy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(editor.value);
      toast('In Zwischenablage kopiert');
    } catch (e) {
      editor.focus();
      editor.select();
      try {
        document.execCommand('copy');
        toast('In Zwischenablage kopiert');
      } catch (err) {
        toast('Kopieren fehlgeschlagen');
      }
      editor.setSelectionRange(0, 0);
    }
  });

  /* Hilfsfunktion: Inhalt aus Zwischenablage (Text oder Datei) einfügen */
  async function pasteFromClipboard(replace) {
    try {
      // Versuche zuerst, Dateien zu lesen
      if (navigator.clipboard.read) {
        try {
          const items = await navigator.clipboard.read();
          console.log( items );
          for (const item of items) {
            const fileTypes = item.types.filter(t => !t.startsWith('text/'));
            if (fileTypes.length > 0) {
              const fileType = fileTypes[0];
              const blob = await item.getType(fileType);
              if (blob.size <= 1024 * 1024) { // 1 MB
                const text = await blob.text();
                if (replace) {
                  setValue(text);
                  toast('Datei eingefügt (ersetzt)');
                } else {
                  insertText(text);
                  toast('Datei eingefügt');
                }
                return;
              } else {
                toast('Datei zu groß (max. 1 MB)');
                return;
              }
            }
          }
        } catch (e) {
          // Fallback auf readText
        }
      }
      // Fallback: Nur Text
      const text = await navigator.clipboard.readText();
      if (text) {
        if (replace) {
          setValue(text);
          toast('Eingefügt (ersetzt)');
        } else {
          insertText(text);
          toast('Eingefügt');
        }
      } else {
        toast('Zwischenablage ist leer');
      }
    } catch (e) {
      editor.focus();
      toast('Bitte Strg+V / ⌘+V im Editor nutzen');
    }
  }

  document.getElementById('btnPaste').addEventListener('click', () => pasteFromClipboard(false));
  document.getElementById('btnPasteReplace').addEventListener('click', () => pasteFromClipboard(true));

  document.getElementById('btnDownload').addEventListener('click', () => {
    const blob = new Blob([editor.value], { type: 'text/html;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = 'index.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast('Download gestartet');
  });

  document.getElementById('btnFormat').addEventListener('click', () => {
    const before = editor.value;
    if (!before.trim()) return;
    const after = formatDoc(before);
    if (after === before) { toast('Bereits formatiert'); return; }
    setValue(after);
    toast('Formatiert');
  });

  document.getElementById('btnFind').addEventListener('click', () => {
    const open = findbar.hidden;
    findbar.hidden = !open;
    if (open) {
      const sel = editor.value.slice(editor.selectionStart, editor.selectionEnd);
      if (sel && sel.indexOf('\n') === -1) findInput.value = sel;
      findInput.focus();
      findInput.select();
    }
  });

  document.getElementById('btnCloseFind').addEventListener('click', () => {
    findbar.hidden = true;
    editor.focus();
  });

  document.getElementById('btnFindNext').addEventListener('click', findNext);
  document.getElementById('btnReplace').addEventListener('click', replaceCurrent);
  document.getElementById('btnReplaceAll').addEventListener('click', replaceAll);

  findInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); findNext(); }
  });
  replaceInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); replaceCurrent(); }
  });

  /* =====================================================================
     Zeilennummern
     ===================================================================== */
  const btnLineNumbers = document.getElementById('btnLineNumbers');
  const lineNumberCheck = btnLineNumbers.querySelector('.check');

  function toggleLineNumbers() {
    showLineNumbers = !showLineNumbers;
    gutter.hidden = !showLineNumbers;
    btnLineNumbers.setAttribute('aria-checked', String(showLineNumbers));
    lineNumberCheck.hidden = !showLineNumbers;
    if (showLineNumbers) {
      updateLineNumbers();
      syncScroll();
    }
    toast(showLineNumbers ? 'Zeilennummern an' : 'Zeilennummern aus');
  }

  btnLineNumbers.addEventListener('click', (e) => {
    e.stopPropagation(); // Dropdown nicht schließen durch Button-Klick (wird extern gehandhabt)
    toggleLineNumbers();
    // Dropdown schließen nach Aktion
    closeAllDropdowns();
  });

  /* =====================================================================
     Suchen & Ersetzen
     ===================================================================== */
  function scrollToIndex(idx) {
    const before = editor.value.slice(0, idx);
    const line = (before.match(/\n/g) || []).length;
    const cs = getComputedStyle(editor);
    const lh = parseFloat(cs.lineHeight) || (parseFloat(cs.fontSize) || 14) * 1.55;
    const target = line * lh - editor.clientHeight / 2 + lh;
    editor.scrollTop = Math.max(0, target);
    syncScroll();
  }

  function findNext() {
    const q = findInput.value;
    if (!q) { findInput.focus(); return; }
    const hay = editor.value.toLowerCase();
    const needle = q.toLowerCase();
    let idx = hay.indexOf(needle, editor.selectionEnd);
    if (idx === -1) idx = hay.indexOf(needle, 0);
    if (idx === -1) { toast('Nicht gefunden'); return; }
    editor.focus();
    editor.setSelectionRange(idx, idx + q.length);
    scrollToIndex(idx);
  }

  function replaceCurrent() {
    const q = findInput.value;
    if (!q) { findInput.focus(); return; }
    const sel = editor.value.slice(editor.selectionStart, editor.selectionEnd);
    if (sel.toLowerCase() === q.toLowerCase()) {
      editor.focus();
      let ok = false;
      try { ok = document.execCommand('insertText', false, replaceInput.value); } catch (e) { ok = false; }
      if (!ok) {
        const s = editor.selectionStart;
        editor.value = editor.value.slice(0, s) + replaceInput.value +
                       editor.value.slice(editor.selectionEnd);
        editor.setSelectionRange(s + replaceInput.value.length, s + replaceInput.value.length);
      }
      updateHighlight();
    }
    findNext();
  }

  function replaceAll() {
    const q = findInput.value;
    if (!q) { findInput.focus(); return; }
    const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(escaped, 'gi');
    const before = editor.value;
    const matches = before.match(re);
    if (!matches) { toast('Nicht gefunden'); return; }
    const after = before.replace(re, () => replaceInput.value);
    setValue(after);
    toast(matches.length + ' Ersetzung' + (matches.length === 1 ? '' : 'en'));
  }

  /* =====================================================================
     Datei laden / Drag & Drop
     ===================================================================== */
  function loadFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      setValue(String(reader.result));
      toast('Geladen: ' + file.name);
    };
    reader.onerror = () => toast('Datei konnte nicht gelesen werden');
    reader.readAsText(file);
  }

  let dragCounter = 0;

  document.addEventListener('dragenter', e => {
    if (!e.dataTransfer) return;
    const types = Array.from(e.dataTransfer.types || []);
    if (types.indexOf('Files') === -1) return;
    e.preventDefault();
    dragCounter++;
    dropOverlay.classList.add('show');
  });

  document.addEventListener('dragover', e => e.preventDefault());

  document.addEventListener('dragleave', () => {
    dragCounter--;
    if (dragCounter <= 0) { dragCounter = 0; dropOverlay.classList.remove('show'); }
  });

  document.addEventListener('drop', e => {
    e.preventDefault();
    dragCounter = 0;
    dropOverlay.classList.remove('show');
    if (!e.dataTransfer) return;
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) { loadFile(f); return; }
    const text = e.dataTransfer.getData('text/plain');
    if (text) { insertText(text); toast('Text eingefügt'); }
  });

  /* =====================================================================
     Editor-Events
     ===================================================================== */
  editor.addEventListener('input', updateHighlight);
  editor.addEventListener('scroll', syncScroll, { passive: true });

  editor.addEventListener('keydown', e => {
    if (e.key === 'Tab') {
      e.preventDefault();
      insertText('  ');
      return;
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'f' || e.key === 'F')) {
      e.preventDefault();
      document.getElementById('btnFind').click();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
      e.preventDefault();
      document.getElementById('btnDownload').click();
      return;
    }
    if (e.key === 'Escape' && !findbar.hidden) {
      findbar.hidden = true;
      editor.focus();
    }
  });

  window.addEventListener('resize', syncScroll);



  document.getElementById('btnShare').addEventListener('click', async () => {
    const fileName = 'index.html';
    const blob = new Blob([editor.value], { type: 'text/html;charset=utf-8' });
    const file = new File([blob], fileName, { type: 'text/html' });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file] });
        toast('Teilen-Menü geöffnet');
      } catch (err) {
        if (err.name !== 'AbortError') {
          console.error('Teilen fehlgeschlagen:', err);
          toast('Teilen fehlgeschlagen – nutze Download');
          document.getElementById('btnDownload').click();
        }
      }
    } else {
      toast('Teilen wird hier nicht unterstützt – Download gestartet');
      document.getElementById('btnDownload').click();
    }
  });


})();
</script>
</body>
</html>
