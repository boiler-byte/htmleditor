<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HTML Editor</title>

<!-- PWA: Manifest, Theme, Icons -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1116">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Editor">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">

<link rel="stylesheet" href="help.css">
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="help.js"></script>
<script src="iFrameInstrumentation.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
[hidden] { display: none !important; }

body {
  margin: 0;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: #0f1116;
  color: #d7dce5;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
}

/* ---------- Toolbar ---------- */
.toolbar, .findbar {
  flex: 0 0 auto;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px;
  background: #151821;
  border-bottom: 1px solid #232833;
}

/* ---------- Dropdown ---------- */
.dropdown { position: relative; display: inline-block; }
.dropdown-toggle {
  -webkit-tap-highlight-color: transparent;
  display: inline-flex; align-items: center; gap: 6px;
  font: inherit; font-size: 14px; padding: 7px 12px; min-height: 36px;
  color: #cfd6e4; background: #1d2230; border: 1px solid #2b3242;
  border-radius: 7px; cursor: pointer; user-select: none;
  white-space: nowrap; line-height: 1;
}
.dropdown-toggle i { font-size: 1.15rem; line-height: 1; }
.dropdown-toggle .caret { font-size: 0.75rem; margin-left: 2px; opacity: 0.7; }
.dropdown-toggle:hover  { background: #262d3e; }
.dropdown-toggle:active { background: #323b50; }

.dropdown-menu {
  position: absolute; top: calc(100% + 4px); left: 0;
  min-width: 220px; background: #1d2230; border: 1px solid #2b3242;
  border-radius: 8px; padding: 5px;
  box-shadow: 0 8px 24px rgba(0,0,0,.45);
  z-index: 50; display: none;
}
.dropdown.open .dropdown-menu { display: block; }

.dropdown-menu button {
  display: flex; align-items: self-start; gap: 10px; width: 100%;
  font: inherit; font-size: 13.5px; text-align: left; padding: 8px 10px;
  color: #cfd6e4; background: transparent; border: 0; border-radius: 6px;
  cursor: pointer; white-space: nowrap; line-height: 1; min-height: 34px;
}
.dropdown-menu button i { font-size: 1.05rem; width: 20px; text-align: center; }
.dropdown-menu button:hover { background: #2a3142; }
.dropdown-menu button:disabled { opacity: 0.4; cursor: not-allowed; }
.dropdown-menu button:disabled:hover { background: transparent; }
.dropdown-menu button .check {
  margin-left: auto; color: #7ee787; font-size: 1rem;
}
.dropdown-menu button .shortcut-hint {
  margin-left: auto;
  color: #7d8590;
  font-size: 11.5px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-weight: 400;
  letter-spacing: 0;
  text-transform: none;
}
.dropdown-menu .sep { height: 1px; background: #2b3242; margin: 5px 4px; }

/* ---------- Info-Dropdown ---------- */
.info-row {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px;
  font-size: 13.5px; color: #cfd6e4; border-radius: 6px; cursor: default;
}
.info-row i { font-size: 1.05rem; width: 20px; text-align: center; }
.info-row .info-value {
  margin-left: auto; color: #7ee787;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 13px; font-weight: 600;
}

/* ---------- Verlauf ---------- */
.history-list {
  max-height: 320px; overflow-y: auto; margin: 0 -2px; padding: 0 2px;
}
.history-list::-webkit-scrollbar { width: 6px; }
.history-list::-webkit-scrollbar-thumb { background: #2b3242; border-radius: 3px; }

.history-item {
  display: flex; flex-direction: column; gap: 3px; padding: 7px 10px;
  border-radius: 6px; cursor: pointer; border: 0; background: transparent;
  text-align: left; width: 100%; font: inherit; color: #cfd6e4; white-space: normal;
}
.history-item:hover { background: #2a3142; }
.history-item .history-name {
  font-size: 13px; color: #e6edf3; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; max-width: 260px; display: flex;
  align-items: center; gap: 8px;
}
.history-item .history-name .version-num {
  color: #7ee787; font-family: ui-monospace, monospace; font-size: 12px;
  flex-shrink: 0; font-weight: 600;
}
.history-item .history-meta {
  font-size: 11px; color: #7d8590;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px;
}
.history-empty {
  padding: 14px 10px; font-size: 12.5px; color: #7d8590;
  text-align: center; line-height: 1.5;
}

/* ---------- Suchleiste ---------- */
.findbar { align-items: flex-start; }

.findbar textarea {
  flex: 1 1 130px; min-width: 0; padding: 7px 9px; font: inherit; font-size: 13px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: #d7dce5; background: #0e1117; border: 1px solid #2b3242;
  border-radius: 7px; outline: none; resize: none; min-height: 34px;
  max-height: 120px; line-height: 1.4; white-space: pre; overflow: auto;
  align-self: flex-start;
}
.findbar textarea:focus { border-color: #3b82f6; }
.findbar textarea::placeholder { color: #6e7681; }

.findbar button {
  -webkit-tap-highlight-color: transparent;
  display: inline-flex; align-items: center; justify-content: center;
  font: inherit; font-size: 14px; padding: 6px 8px; min-width: 36px; min-height: 34px;
  color: #cfd6e4; background: #1d2230; border: 1px solid #2b3242;
  border-radius: 7px; cursor: pointer; user-select: none;
  white-space: nowrap; line-height: 1; align-self: flex-start;
}
.findbar button i { font-size: 1.05rem; line-height: 1; }
.findbar button:hover { background: #262d3e; }

/* ---------- Main Area (Editor + Panels) ---------- */
.main-area {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ---------- Editor ---------- */
.editor-wrap {
  position: relative;
  flex: 1 1 0;
  min-height: 0;
  overflow: hidden;
  background: #0f1116;
  display: flex;
}

/* Zeilennummern */
.gutter {
  flex: 0 0 auto;
  width: 48px;
  overflow: hidden;
  background: #0c0e13;
  border-right: 1px solid #232833;
  position: relative;
  z-index: 2;
  align-self: stretch;
}

.gutter pre {
  margin: 0;
  padding: 12px 8px 48px;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 14px;
  line-height: 1.55;
  text-align: right;
  color: #4b5566;
  white-space: pre;
  user-select: none;
  pointer-events: none;
  will-change: transform;
}

.code-area {
  position: relative; flex: 1 1 auto; min-width: 0; overflow: hidden;
}

.code-area pre,
.code-area textarea {
  position: absolute; inset: 0; margin: 0; padding: 12px 12px 48px;
  border: 0; outline: 0;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 14px; line-height: 1.55; letter-spacing: 0; tab-size: 2; -moz-tab-size: 2;
  white-space: pre; overflow-wrap: normal; word-break: normal;
}
.code-area pre { overflow: hidden; pointer-events: none; color: #d7dce5; z-index: 0; }
.code-area textarea {
  overflow: auto; resize: none; background: transparent;
  color: transparent; -webkit-text-fill-color: transparent;
  caret-color: #7ee787; z-index: 1;
}
.code-area textarea::selection      { background: rgba(88,140,255,.35); }
.code-area textarea::-moz-selection { background: rgba(88,140,255,.35); }

/* ---------- Panels (Konsole / Vorschau) ---------- */
.console-panel,
.preview-panel {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.console-panel {
  background: #0c0e13;
  border-bottom: 1px solid #232833;
}

.preview-panel {
  background: #ffffff;
  border-top: 1px solid #232833;
}

.panel-header {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 10px;
  background: #151821;
  border-bottom: 1px solid #232833;
  min-height: 32px;
}

.preview-panel .panel-header {
  border-bottom: 1px solid #232833;
}

.panel-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  font-weight: 600;
  color: #cfd6e4;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.panel-title i { font-size: 1rem; }

.panel-actions {
  margin-left: auto;
  display: flex;
  gap: 4px;
}

.panel-btn {
  -webkit-tap-highlight-color: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  min-height: 26px;
  padding: 2px 6px;
  color: #cfd6e4;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 5px;
  cursor: pointer;
  font-size: 13px;
  line-height: 1;
}
.panel-btn i { font-size: 0.95rem; }
.panel-btn:hover { background: #2a3142; border-color: #2b3242; }

/* --- Konsole --- */
.console-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 4px 0;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12.5px;
  line-height: 1.5;
}
.console-body::-webkit-scrollbar { width: 8px; }
.console-body::-webkit-scrollbar-thumb { background: #2b3242; border-radius: 4px; }

.console-empty {
  padding: 20px 10px;
  text-align: center;
  color: #6e7681;
  font-style: italic;
}

.console-msg {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 3px 10px;
  border-left: 3px solid transparent;
  white-space: pre-wrap;
  word-break: break-word;
}
.console-msg:hover { background: rgba(255, 255, 255, 0.03); }

.console-msg.level-log    { border-left-color: #6e7681; }
.console-msg.level-info   { border-left-color: #79c0ff; background: rgba(121, 192, 255, 0.04); }
.console-msg.level-warn   { border-left-color: #d29922; background: rgba(210, 153, 34, 0.06); }
.console-msg.level-error  { border-left-color: #f85149; background: rgba(248, 81, 73, 0.08); }

.console-time {
  flex: 0 0 auto;
  color: #4b5566;
  font-size: 11px;
  padding-top: 2px;
}

.console-level {
  flex: 0 0 auto;
  padding: 0px 5px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-top: 2px;
  min-width: 42px;
  text-align: center;
}
.level-log .console-level   { background: #21262d; color: #8b949e; }
.level-info .console-level  { background: #1f3a5f; color: #79c0ff; }
.level-warn .console-level  { background: #3d2f00; color: #d29922; }
.level-error .console-level { background: #4a1517; color: #f85149; }

.console-text {
  flex: 1 1 auto;
  min-width: 0;
  color: #d7dce5;
}
.level-warn .console-text  { color: #e3b341; }
.level-error .console-text { color: #ff7b72; }

.console-copy {
  flex: 0 0 auto;
  background: transparent;
  border: 1px solid #2b3242;
  color: #8b949e;
  border-radius: 4px;
  padding: 0px 5px;
  font-size: 11px;
  line-height: 1;
  min-height: 20px;
  cursor: pointer;
  opacity: 0.55;
  transition: opacity 0.12s, color 0.12s, background 0.12s;
}
.console-msg:hover .console-copy { opacity: 1; }
.console-copy:hover { color: #e6edf3; background: #2a3142; }

/* --- Vorschau --- */
.preview-panel iframe {
  flex: 1 1 auto;
  width: 100%;
  border: 0;
  background: #ffffff;
  min-height: 0;
  display: block;
}

/* Vorschau-Panel im Vollbild */
.preview-panel:fullscreen {
  width: 100vw;
  height: 100vh;
  background: #ffffff;
}
.preview-panel:fullscreen .panel-header {
  background: #151821;
}

/* ---------- Minimap ---------- */
.minimap {
  position: relative; flex: 0 0 auto; width: 82px;
  background: #0c0e13; border-left: 1px solid #232833;
  overflow: hidden; cursor: pointer; user-select: none; -webkit-user-select: none;
  touch-action: none;
}
.minimap canvas {
  display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
}
.minimap-viewport {
  position: absolute; left: 0; right: 0;
  background: rgba(88, 140, 255, 0.10);
  border-top: 1px solid rgba(88, 140, 255, 0.35);
  border-bottom: 1px solid rgba(88, 140, 255, 0.35);
  pointer-events: none; transition: background 0.12s;
}
.minimap:hover .minimap-viewport { background: rgba(88, 140, 255, 0.18); }

body.minimap-dragging,
body.minimap-dragging * {
  cursor: grabbing !important;
  user-select: none !important;
}

/* ---------- Token-Farben ---------- */
.t-comment { color: #6e7681; font-style: italic; }
.t-tag     { color: #7ee787; }
.t-attr    { color: #79c0ff; }
.t-str     { color: #a5d6ff; }
.t-punct   { color: #7d8590; }
.t-meta    { color: #7d8590; }
.t-kw      { color: #ff7b72; }
.t-num     { color: #79c0ff; }
.t-sel     { color: #d2a8ff; }
.t-prop    { color: #79c0ff; }
.t-val     { color: #c9d1d9; }
.t-id      { color: #e6edf3; }
.t-op      { color: #8b949e; }

/* ---------- Drag & Drop Overlay ---------- */
.drop-overlay {
  position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
  background: rgba(10, 14, 22, .82); border: 3px dashed #3b82f6;
  color: #93c5fd; font-size: 18px; font-weight: 600;
  z-index: 100; pointer-events: none; text-align: center; padding: 20px;
}
.drop-overlay.show { display: flex; }

/* ---------- Toast ---------- */
#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
  background: #1d2433; color: #e6edf3; border: 1px solid #2f3a4d;
  padding: 10px 16px; border-radius: 8px; font-size: 13px;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  z-index: 200; max-width: 90vw; text-align: center;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Dropdown, das rechtsbündig öffnet */
.dropdown.align-right .dropdown-menu { left: auto; right: 0; }
.dropdown-menu { max-width: calc(100vw - 16px); }



/* ---------- Mobile ---------- */
@media (max-width: 640px) {
  .code-area pre,
  .code-area textarea,
  .gutter pre { font-size: 14px; padding: 12px 8px 48px 0; }
  .dropdown-toggle { padding: 8px 10px; }
  .gutter { width: 42px; }
  .dropdown.align-right .dropdown-menu { left: auto; right: 0; }
  .findbar textarea { font-size: 16px; }
  .minimap { width: 58px; }
}
</style>
</head>
<body>

<div class="toolbar">
  <!-- Dropdown: Datei -->
  <div class="dropdown" id="ddFile">
    <button class="dropdown-toggle" id="ddFileToggle" aria-haspopup="true" aria-expanded="false">
      <i class="bi bi-folder2-open" aria-hidden="true"></i>
      <span>Datei</span>
      <i class="bi bi-chevron-down caret" aria-hidden="true"></i>
    </button>
    <div class="dropdown-menu" role="menu" aria-labelledby="ddFileToggle">
      <button id="btnOpen" role="menuitem">
        <i class="bi bi-folder2-open" aria-hidden="true"></i>
        <span>Datei öffnen</span>
      </button>
      <button id="btnPaste" role="menuitem">
        <i class="bi bi-clipboard-plus" aria-hidden="true"></i>
        <span>Einfügen</span>
      </button>
      <button id="btnPasteReplace" role="menuitem">
        <i class="bi bi-arrow-left-right" aria-hidden="true"></i>
        <span>Einfügen &amp; Ersetzen</span>
      </button>
      <button id="btnCopy" role="menuitem">
        <i class="bi bi-clipboard" aria-hidden="true"></i>
        <span>Kopieren</span>
      </button>
      <div class="sep" role="separator"></div>
      <button id="btnDownload" role="menuitem">
        <i class="bi bi-download" aria-hidden="true"></i>
        <span>Download</span>
      </button>
      <button id="btnShare" role="menuitem">
        <i class="bi bi-share" aria-hidden="true"></i>
        <span>Teilen</span>
      </button>
    </div>
  </div>

  <!-- Dropdown: Bearbeiten -->
  <div class="dropdown" id="ddEdit">
    <button class="dropdown-toggle" id="ddEditToggle" aria-haspopup="true" aria-expanded="false">
      <i class="bi bi-pencil-square" aria-hidden="true"></i>
      <i class="bi bi-chevron-down caret" aria-hidden="true"></i>
    </button>
    <div class="dropdown-menu" role="menu" aria-labelledby="ddEditToggle">
      <button id="btnUndo" role="menuitem" disabled>
        <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>
        <span>Rückgängig</span>
        <span class="shortcut-hint">Strg+Z</span>
      </button>
      <button id="btnRedo" role="menuitem" disabled>
        <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
        <span>Wiederherstellen</span>
        <span class="shortcut-hint">Strg+Y</span>
      </button>
      <div class="sep" role="separator"></div>
      <button id="btnFind" role="menuitem">
        <i class="bi bi-search" aria-hidden="true"></i>
        <span>Suchen/Ersetzen</span>
      </button>
      <button id="btnFormat" role="menuitem">
        <i class="bi bi-magic" aria-hidden="true"></i>
        <span>Formatieren</span>
      </button>
      <div class="sep" role="separator"></div>
      <div class="info-row" role="menuitem" tabindex="-1">
        <i class="bi bi-list-ol" aria-hidden="true"></i>
        <span>Zeilen</span>
        <span class="info-value" id="infoLines">0</span>
      </div>
      <div class="info-row" role="menuitem" tabindex="-1">
        <i class="bi bi-textarea-t" aria-hidden="true"></i>
        <span>Zeichen</span>
        <span class="info-value" id="infoChars">0</span>
      </div>
    </div>
  </div>

  <!-- Dropdown: Ansicht -->
  <div class="dropdown align-right" id="ddView">
    <button class="dropdown-toggle" id="ddViewToggle" aria-haspopup="true" aria-expanded="false">
      <i class="bi bi-eye" aria-hidden="true"></i>
      <i class="bi bi-chevron-down caret" aria-hidden="true"></i>
    </button>
    <div class="dropdown-menu" role="menu" aria-labelledby="ddViewToggle">
      <button id="btnMinimap" role="menuitemcheckbox" aria-checked="false">
        <i class="bi bi-map" aria-hidden="true"></i>
        <span>Scroll Minimap</span>
        <i class="bi bi-check-lg check" id="mmCheck" hidden aria-hidden="true"></i>
      </button>
      <button id="btnLineNumbers" role="menuitemcheckbox" aria-checked="false">
        <i class="bi bi-list-ol" aria-hidden="true"></i>
        <span>Zeilennummern anz.</span>
        <i class="bi bi-check-lg check" hidden aria-hidden="true"></i>
      </button>
      <div class="sep" role="separator"></div>
      <button id="btnPreview" role="menuitemcheckbox" aria-checked="false">
        <i class="bi bi-window" aria-hidden="true"></i>
        <span>Vorschau</span>
        <i class="bi bi-check-lg check" id="previewCheck" hidden aria-hidden="true"></i>
      </button>
      <button id="btnConsole" role="menuitemcheckbox" aria-checked="false">
        <i class="bi bi-terminal" aria-hidden="true"></i>
        <span>Konsole</span>
        <i class="bi bi-check-lg check" id="consoleCheck" hidden aria-hidden="true"></i>
      </button>
      <div class="sep" role="separator"></div>
      <button id="btnClearPreviewData" role="menuitem">
        <i class="bi bi-database-x" aria-hidden="true"></i>
        <span>Vorschau-Daten löschen</span>
      </button>
    </div>
  </div>

  <!-- Dropdown: Verlauf -->
  <div class="dropdown align-right" id="ddHistory">
    <button class="dropdown-toggle" id="ddHistoryToggle" aria-haspopup="true" aria-expanded="false">
      <i class="bi bi-clock-history" aria-hidden="true"></i>
      <i class="bi bi-chevron-down caret" aria-hidden="true"></i>
    </button>
    <div class="dropdown-menu" role="menu" aria-labelledby="ddHistoryToggle" style="min-width: 280px;">
      <button id="btnSaveVersion" role="menuitem">
        <i class="bi bi-bookmark-plus" aria-hidden="true"></i>
        <span>Version Speichern</span>
      </button>
      <div class="sep" role="separator"></div>
      <div id="historyList" class="history-list"></div>
    </div>
  </div>

    <!-- Hilfe -->
  <button class="dropdown-toggle" id="btnHelp" aria-haspopup="dialog" aria-label="Hilfe öffnen" title="Hilfe">
    <i class="bi bi-question-circle" aria-hidden="true"></i>
  </button>
</div>

<div class="findbar" id="findbar" hidden>
  <textarea id="findInput" rows="1" placeholder="Suchen … (Strg+Enter)" autocomplete="off" spellcheck="false"></textarea>
  <textarea id="replaceInput" rows="1" placeholder="Ersetzen … (Strg+Enter)" autocomplete="off" spellcheck="false"></textarea>
  <button id="btnFindNext" title="Nächster Treffer" aria-label="Nächster Treffer">

<script>
(function () {
  'use strict';

  /* =====================================================================
     Hilfsfunktionen
     ===================================================================== */
  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function sp(cls, text) {
    return '<span class="t-' + cls + '">' + esc(text) + '</span>';
  }

  /* =====================================================================
     Syntax-Highlighting: CSS
     ===================================================================== */
  const CSS_RE = /\/\*[\s\S]*?\*\/|"(?:\\[\s\S]|[^"\\])*"|'(?:\\[\s\S]|[^'\\])*'|#[0-9a-fA-F]{3,8}\b|@[-\w]+|[{}:;(),]|\d+(?:\.\d+)?(?:[a-z%]+)?|[.#][-\w]+|[-\w]+/g;

  function highlightCSS(code) {
    let out = '', pos = 0, m;
    CSS_RE.lastIndex = 0;
    while ((m = CSS_RE.exec(code))) {
      if (m.index > pos) out += esc(code.slice(pos, m.index));
      const t = m[0];
      let cls;
      if (t.charCodeAt(0) === 47 && t[1] === '*')          cls = 'comment';
      else if (t[0] === '"' || t[0] === "'")               cls = 'str';
      else if (t[0] === '@')                               cls = 'kw';
      else if (t[0] === '#' && t.length > 1 && /^#[0-9a-fA-F]{3,8}$/.test(t)) cls = 'num';
      else if ((t[0] === '.' || t[0] === '#') && t.length > 1) cls = 'sel';
      else if (t.length === 1 && '{}:;(),'.indexOf(t) !== -1)  cls = 'punct';
      else if (/^\d/.test(t))                              cls = 'num';
      else cls = /^\s*:/.test(code.slice(m.index + t.length)) ? 'prop' : 'val';
      out += sp(cls, t);
      pos = m.index + t.length;
    }
    if (pos < code.length) out += esc(code.slice(pos));
    return out;
  }

  /* =====================================================================
     Syntax-Highlighting: JavaScript
     ===================================================================== */
  const JS_KEYWORDS = new Set((
    'const let var function return if else for while do switch case default break continue ' +
    'new class extends super this typeof instanceof in of delete void try catch finally throw ' +
    'async await yield import export from null undefined true false NaN Infinity static get set'
  ).split(' '));

  const JS_RE = /\/\/[^\n]*|\/\*[\s\S]*?\*\/|`(?:\\[\s\S]|[^`\\])*`|"(?:\\[\s\S]|[^"\\\n])*"|'(?:\\[\s\S]|[^'\\\n])*'|\d+(?:\.\d+)?(?:e[+-]?\d+)?|[A-Za-z_$][\w$]*|[{}()[\];,.]|[+\-*/%=<>!&|^~?:]+/g;

  function highlightJS(code) {
    let out = '', pos = 0, m;
    JS_RE.lastIndex = 0;
    while ((m = JS_RE.exec(code))) {
      if (m.index > pos) out += esc(code.slice(pos, m.index));
      const t = m[0];
      let cls;
      if (t[0] === '/' && (t[1] === '/' || t[1] === '*'))     cls = 'comment';
      else if (t[0] === '"' || t[0] === "'" || t[0] === '`')  cls = 'str';
      else if (/^\d/.test(t))                                 cls = 'num';
      else if (/^[A-Za-z_$]/.test(t))                         cls = JS_KEYWORDS.has(t) ? 'kw' : 'id';
      else if (t.length === 1 && '{}()[];,.:'.indexOf(t) !== -1) cls = 'punct';
      else cls = 'op';
      out += sp(cls, t);
      pos = m.index + t.length;
    }
    if (pos < code.length) out += esc(code.slice(pos));
    return out;
  }

  /* =====================================================================
     Syntax-Highlighting: HTML (mit eingebettetem CSS/JS)
     ===================================================================== */
  function colorizeTag(tag) {
    let out = '', i = 0;
    const n = tag.length;

    if (tag.startsWith('</')) { out += sp('punct', '</'); i = 2; }
    else                      { out += sp('punct', '<');  i = 1; }

    const m = /^[a-zA-Z][\w:-]*/.exec(tag.slice(i));
    if (m) { out += sp('tag', m[0]); i += m[0].length; }

    while (i < n) {
      const c = tag[i];
      if (c === '>')       { out += sp('punct', '>'); i++; }
      else if (c === '/')  { out += sp('punct', '/'); i++; }
      else if (c === '=')  { out += sp('punct', '='); i++; }
      else if (c === '"' || c === "'") {
        const e = tag.indexOf(c, i + 1);
        const end = e === -1 ? n : e + 1;
        out += sp('str', tag.slice(i, end));
        i = end;
      }
      else if (/\s/.test(c)) { out += esc(c); i++; }
      else {
        let j = i;
        while (j < n && !/[\s=>"'\/]/.test(tag[j])) j++;
        if (j === i) j = i + 1;
        out += sp('attr', tag.slice(i, j));
        i = j;
      }
    }
    return out;
  }

  function highlightHTML(code) {
    let out = '', i = 0;
    const n = code.length;

    while (i < n) {
      const lt = code.indexOf('<', i);
      if (lt === -1) { out += esc(code.slice(i)); break; }
      if (lt > i) out += esc(code.slice(i, lt));

      if (code.startsWith('<!--', lt)) {
        const e = code.indexOf('-->', lt + 4);
        const end = e === -1 ? n : e + 3;
        out += sp('comment', code.slice(lt, end));
        i = end;
        continue;
      }

      if (code.startsWith('<!', lt)) {
        const e = code.indexOf('>', lt);
        const end = e === -1 ? n : e + 1;
        out += sp('meta', code.slice(lt, end));
        i = end;
        continue;
      }

      const m = /^<(\/?)([a-zA-Z][\w:-]*)/.exec(code.slice(lt, lt + 200));
      if (!m) { out += esc('<'); i = lt + 1; continue; }

      let j = lt + m[0].length, q = null, end = -1;
      while (j < n) {
        const c = code[j];
        if (q) { if (c === q) q = null; }
        else if (c === '"' || c === "'") q = c;
        else if (c === '>') { end = j; break; }
        j++;
      }
      if (end === -1) { out += esc(code.slice(lt)); break; }

      out += colorizeTag(code.slice(lt, end + 1));
      i = end + 1;

      const name = m[2].toLowerCase();
      if (!m[1] && (name === 'style' || name === 'script')) {
        const rest = code.slice(i);
        const cm = new RegExp('</' + name + '\\s*>', 'i').exec(rest);
        const inner = cm ? rest.slice(0, cm.index) : rest;
        out += (name === 'style') ? highlightCSS(inner) : highlightJS(inner);
        i += inner.length;
      }
    }
    return out;
  }

  function highlight(code) {
    const t = code.trim();
    if (t && t.indexOf('<') === -1) {
      if (/\b(function|const|let|var|return)\b|=>/.test(t)) return highlightJS(code);
      if (/[{}]/.test(t) && t.indexOf(':') !== -1)          return highlightCSS(code);
      return highlightJS(code);
    }
    return highlightHTML(code);
  }

  /* =====================================================================
     Pretty-Format
     ===================================================================== */
  function formatCSS(src) {
    let out = '', indent = 0, i = 0;
    const n = src.length;
    let atLineStart = true;
    const pad  = () => '  '.repeat(indent);
    const write = (s) => { if (atLineStart) { out += pad(); atLineStart = false; } out += s; };
    const nl    = () => { out = out.replace(/[ \t]+$/, '') + '\n'; atLineStart = true; };

    while (i < n) {
      const c = src[i];
      if (c === '/' && src[i + 1] === '*') {
        const e = src.indexOf('*/', i + 2);
        const end = e === -1 ? n : e + 2;
        write(src.slice(i, end)); nl(); i = end; continue;
      }
      if (c === '"' || c === "'") {
        let j = i + 1;
        while (j < n && src[j] !== c) { if (src[j] === '\\') j++; j++; }
        write(src.slice(i, j + 1)); i = j + 1; continue;
      }
      if (/\s/.test(c)) {
        let j = i;
        while (j < n && /\s/.test(src[j])) j++;
        if (j < n && '{};,'.indexOf(src[j]) === -1 && !atLineStart) write(' ');
        i = j; continue;
      }
      if (c === '{') { write(' {'); nl(); indent++; i++; continue; }
      if (c === '}') { nl(); indent = Math.max(0, indent - 1); write('}'); nl(); i++; continue; }
      if (c === ';') { write(';'); nl(); i++; continue; }
      write(c);
      i++;
    }
    return out.replace(/\n{3,}/g, '\n\n').trim();
  }

  function formatJS(src) {
    let out = '', indent = 0, i = 0, paren = 0;
    const n = src.length;
    let atLineStart = true;
    const pad   = () => '  '.repeat(indent);
    const write = (s) => { if (atLineStart) { out += pad(); atLineStart = false; } out += s; };
    const nl    = () => { out = out.replace(/[ \t]+$/, '') + '\n'; atLineStart = true; };

    while (i < n) {
      const c = src[i];
      if (c === '/' && src[i + 1] === '/') {
        let j = src.indexOf('\n', i);
        if (j === -1) j = n;
        write(src.slice(i, j)); nl(); i = j; continue;
      }
      if (c === '/' && src[i + 1] === '*') {
        const e = src.indexOf('*/', i + 2);
        const end = e === -1 ? n : e + 2;
        write(src.slice(i, end)); nl(); i = end; continue;
      }
      if (c === '"' || c === "'" || c === '`') {
        let j = i + 1;
        while (j < n && src[j] !== c) { if (src[j] === '\\') j++; j++; }
        write(src.slice(i, j + 1)); i = j + 1; continue;
      }
      if (/\s/.test(c)) {
        let j = i;
        while (j < n && /\s/.test(src[j])) j++;
        if (j < n && '};,)].'.indexOf(src[j]) === -1 && !atLineStart) write(' ');
        i = j; continue;
      }
      if (c === '(') { paren++; write('('); i++; continue; }
      if (c === ')') { paren = Math.max(0, paren - 1); write(')'); i++; continue; }
      if (c === '{') { write(' {'); nl(); indent++; i++; continue; }
      if (c === '}') {
        nl();
        indent = Math.max(0, indent - 1);
        write('}');
        let j = i + 1;
        while (j < n && /[ \t]/.test(src[j])) j++;
        const nx = src[j];
        const tail = src.slice(j, j + 8);
        if (nx === ';' || nx === ',' || nx === ')' || nx === ']' || nx === '.' || nx === '(') {
        } else if (/^(else|catch|finally)\b/.test(tail)) {
          write(' ');
        } else {
          nl();
        }
        i++;
        continue;
      }
      if (c === ';' && paren === 0) { write(';'); nl(); i++; continue; }
      write(c);
      i++;
    }
    return out.replace(/\n{3,}/g, '\n\n').trim();
  }

  const VOID_TAGS = new Set('area base br col embed hr img input link meta param source track wbr'.split(' '));

  function collapseTag(t) {
    let out = '', q = null;
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (q) { out += c; if (c === q) q = null; }
      else if (c === '"' || c === "'") { q = c; out += c; }
      else if (c === '>') { out = out.replace(/\s+$/, '') + '>'; }
      else if (/\s/.test(c)) { if (!/\s$/.test(out)) out += ' '; }
      else out += c;
    }
    return out.trim();
  }

  function formatHTML(src) {
    const out = [];
    let indent = 0, i = 0;
    const n = src.length;
    const pad  = () => '  '.repeat(indent);
    const push = (s) => out.push(pad() + s);

    while (i < n) {
      const lt = src.indexOf('<', i);
      if (lt === -1) {
        const text = src.slice(i).trim();
        if (text) push(text);
        break;
      }
      if (lt > i) {
        const text = src.slice(i, lt).trim();
        if (text) push(text);
      }

      if (src.startsWith('<!--', lt)) {
        const e = src.indexOf('-->', lt);
        const end = e === -1 ? n : e + 3;
        push(collapseTag(src.slice(lt, end)));
        i = end; continue;
      }
      if (src.startsWith('<!', lt)) {
        const e = src.indexOf('>', lt);
        const end = e === -1 ? n : e + 1;
        push(collapseTag(src.slice(lt, end)));
        i = end; continue;
      }

      let j = lt + 1, q = null, end = -1;
      while (j < n) {
        const c = src[j];
        if (q) { if (c === q) q = null; }
        else if (c === '"' || c === "'") q = c;
        else if (c === '>') { end = j; break; }
        j++;
      }
      if (end === -1) {
        const rest = src.slice(lt).trim();
        if (rest) push(rest);
        break;
      }

      const raw = src.slice(lt, end + 1);
      const tm = /^<(\/?)([a-zA-Z][\w:-]*)/.exec(raw);
      if (!tm) { push(collapseTag(raw)); i = end + 1; continue; }

      const closing   = tm[1] === '/';
      const name      = tm[2].toLowerCase();
      const selfClose = /\/>$/.test(raw) || VOID_TAGS.has(name);

      if (closing) {
        indent = Math.max(0, indent - 1);
        push(collapseTag(raw));
        i = end + 1;
        continue;
      }

      push(collapseTag(raw));
      i = end + 1;

      if (name === 'style' || name === 'script') {
        const cm = new RegExp('</' + name + '\\s*>', 'i').exec(src.slice(i));
        const inner = cm ? src.slice(i, i + cm.index) : src.slice(i);
        const formatted = (name === 'style') ? formatCSS(inner) : formatJS(inner);
        if (formatted.trim()) {
          indent++;
          formatted.split('\n').forEach(line => {
            out.push(line.trim() ? pad() + line : '');
          });
          indent--;
        }
        i += inner.length;
        continue;
      }

      if (!selfClose) indent++;
    }

    return out.join('\n');
  }

  function formatDoc(src) {
    const t = src.trim();
    if (!t) return src;
    if (t.indexOf('<') !== -1) return formatHTML(src);
    if (/\b(function|const|let|var|return)\b|=>/.test(t)) return formatJS(src);
    if (/\{[\s\S]*:[\s\S]*\}/.test(t)) return formatCSS(src);
    return formatJS(src);
  }

  /* =====================================================================
     Editor-Aufbau
     ===================================================================== */
  const editor       = document.getElementById('editor');
  const hlEl         = document.getElementById('hl');
  const editorWrap   = document.getElementById('editorWrap');
  const findbar      = document.getElementById('findbar');
  const findInput    = document.getElementById('findInput');
  const replaceInput = document.getElementById('replaceInput');
  const fileInput    = document.getElementById('fileInput');
  const dropOverlay  = document.getElementById('dropOverlay');
  const gutter       = document.getElementById('gutter');
  const lineNumbers  = document.getElementById('lineNumbers');
  const infoLines    = document.getElementById('infoLines');
  const infoChars    = document.getElementById('infoChars');

  let rafPending = false;

  /* ---------- Persistente App-Optionen (localStorage) ---------- */
  const APP_STORAGE_KEY = 'htmleditorApp';

  function loadAppOptions() {
    try {
      const raw = localStorage.getItem(APP_STORAGE_KEY);
      if (!raw) return {};
      const parsed = JSON.parse(raw);
      return (parsed && typeof parsed === 'object') ? parsed : {};
    } catch (e) {
      return {};
    }
  }

  function saveAppOptions(patch) {
    try {
      const current = loadAppOptions();
      const next = Object.assign({}, current, patch);
      localStorage.setItem(APP_STORAGE_KEY, JSON.stringify(next));
    } catch (e) {
      /* localStorage kann blockiert sein – still ignorieren */
    }
  }

  const appOptions = loadAppOptions();

  let showLineNumbers = appOptions.lineNumbers !== false;

  function syncScroll() {
    hlEl.scrollTop  = editor.scrollTop;
    hlEl.scrollLeft = editor.scrollLeft;
    if (showLineNumbers) {
      lineNumbers.style.transform = 'translateY(' + (-editor.scrollTop) + 'px)';
    }
    if (showMinimap) scheduleMinimapUpdate();
  }

  /* Parallax-Scrolling-Minimap mit fixer Viewport-Größe:
     RAF-throttled Neuzeichnen bei jedem Scroll. */
  let minimapUpdatePending = false;
  function scheduleMinimapUpdate() {
    if (minimapUpdatePending || !showMinimap) return;
    minimapUpdatePending = true;
    requestAnimationFrame(() => {
      minimapUpdatePending = false;
      drawMinimap();
      updateMinimapViewport();
    });
  }

  function updateLineNumbers() {
    if (!showLineNumbers) return;
    const count = editor.value.split('\n').length;
    let s = '';
    for (let i = 1; i <= count; i++) s += i + '\n';
    lineNumbers.textContent = s;
    lineNumbers.style.transform = 'translateY(' + (-editor.scrollTop) + 'px)';
  }

  function updateInfo() {
    const v = editor.value;
    const lines = v.length === 0 ? 1 : v.split('\n').length;
    infoLines.textContent = lines.toLocaleString('de-DE');
    infoChars.textContent = v.length.toLocaleString('de-DE');
  }

  function updateHighlight() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => {
      rafPending = false;
      hlEl.innerHTML = highlight(editor.value) + '\n';
      if (showLineNumbers) updateLineNumbers();
      updateInfo();
      syncScroll();
    });
  }

  function setValue(text) {
    editor.value = text;
    editor.scrollTop = 0;
    editor.scrollLeft = 0;
    editor.setSelectionRange(0, 0);
    updateHighlight();
    updateInfo();
  }

  function insertText(text) {
    editor.focus();
    let ok = false;
    try { ok = document.execCommand('insertText', false, text); } catch (e) { ok = false; }
    if (!ok) {
      const s = editor.selectionStart, e = editor.selectionEnd;
      editor.value = editor.value.slice(0, s) + text + editor.value.slice(e);
      editor.setSelectionRange(s + text.length, s + text.length);
      updateHighlight();
      scheduleUndoCommit(); // Fallback feuert kein natives input-Event
    }
  }

  /* =====================================================================
     Undo / Redo mit Snapshot-Stack
     =====================================================================
     - Maximal 20 Snapshots
     - Nicht persistiert (nur im Speicher)
     - Ein Arbeitsschritt endet nach 5 s Untätigkeit oder sofort bei
       Undo/Redo bzw. bei "harten" Aktionen (Formatieren, Öffnen,
       Einfügen & Ersetzen, Version laden, Alle ersetzen, Datei laden)
     - undoStack enthält Zustände VOR jeder Änderung
     - redoStack enthält Zustände, die durch Undo entfernt wurden
     ===================================================================== */
  const UNDO_MAX_SNAPSHOTS = 20;
  const UNDO_COMMIT_DELAY  = 5000;

  const undoStack = [];
  const redoStack = [];
  let undoCommitTimer = null;
  let lastKnownValue  = editor.value;

  const btnUndo = document.getElementById('btnUndo');
  const btnRedo = document.getElementById('btnRedo');

  function updateUndoButtons() {
    btnUndo.disabled = undoStack.length === 0;
    btnRedo.disabled = redoStack.length === 0;
  }

  function clearUndoCommitTimer() {
    if (undoCommitTimer !== null) {
      clearTimeout(undoCommitTimer);
      undoCommitTimer = null;
    }
  }

  function commitUndoSnapshot() {
    clearUndoCommitTimer();
    const current = editor.value;
    if (current === lastKnownValue) return;
    undoStack.push(lastKnownValue);
    if (undoStack.length > UNDO_MAX_SNAPSHOTS) undoStack.shift();
    redoStack.length = 0;
    lastKnownValue = current;
    updateUndoButtons();
  }

  function scheduleUndoCommit() {
    clearUndoCommitTimer();
    undoCommitTimer = setTimeout(() => {
      undoCommitTimer = null;
      commitUndoSnapshot();
    }, UNDO_COMMIT_DELAY);
  }

  function performUndo() {
    if (editor.value !== lastKnownValue) {
      commitUndoSnapshot();
    }
    if (undoStack.length === 0) {
      toast('Nichts rückgängig zu machen');
      return;
    }
    clearUndoCommitTimer();
    const prev = undoStack.pop();
    redoStack.push(editor.value);
    if (redoStack.length > UNDO_MAX_SNAPSHOTS) redoStack.shift();
    setValue(prev);
    lastKnownValue = prev;
    updateUndoButtons();
    toast('Rückgängig');
  }

  function performRedo() {
    if (redoStack.length === 0) {
      toast('Nichts wiederherzustellen');
      return;
    }
    clearUndoCommitTimer();
    const next = redoStack.pop();
    undoStack.push(editor.value);
    if (undoStack.length > UNDO_MAX_SNAPSHOTS) undoStack.shift();
    setValue(next);
    lastKnownValue = next;
    updateUndoButtons();
    toast('Wiederhergestellt');
  }

  /**
   * Wird vor einer "harten" Aktion aufgerufen: Committet ausstehende
   * Änderungen und stellt sicher, dass der aktuelle Zustand als
   * Undo-Punkt vorhanden ist (damit Undo nach der Aktion den
   * Vor-Aktions-Zustand wiederherstellt).
   */
  function commitUndoNow() {
    clearUndoCommitTimer();
    if (editor.value !== lastKnownValue) {
      commitUndoSnapshot();
    }
    if (undoStack.length === 0 || undoStack[undoStack.length - 1] !== lastKnownValue) {
      undoStack.push(lastKnownValue);
      if (undoStack.length > UNDO_MAX_SNAPSHOTS) undoStack.shift();
    }
    redoStack.length = 0;
    updateUndoButtons();
  }

    closeAllDropdowns();

  /* =====================================================================
     Minimap (Parallax-Scrolling mit *dynamischem* Parallax-Faktor)
     ===================================================================== */
  const minimap         = document.getElementById('minimap');
  const minimapCanvas   = document.getElementById('minimapCanvas');
  const minimapViewport = document.getElementById('minimapViewport');
  const minimapCtx      = minimapCanvas.getContext('2d');

  const MM_PAD_Y      = 6;
  const MM_LINE_H_MAX = 3;
  const MM_LINE_H_MIN = 0.4;
  const MM_VP_MIN_H   = 64;   /* Mindesthöhe des Viewport-Handles in px */

  let showMinimap       = appOptions.minimap !== false;
  let minimapDragging   = false;
  let minimapDragStartY = 0;
  let minimapDragStartScroll = 0;

  function getMinimapLineHeight(totalLines) {
    const availH = minimap.clientHeight - MM_PAD_Y * 2;
    if (availH <= 0) return MM_LINE_H_MAX;
    return Math.max(MM_LINE_H_MIN, Math.min(MM_LINE_H_MAX, availH / Math.max(1, totalLines)));
  }

  function getMinimapMetrics() {
    const cs = getComputedStyle(editor);
    const editorLineH = parseFloat(cs.lineHeight) || 22;
    const lines = editor.value.split('\n');
    const totalLines = lines.length;
    const visibleLines = editor.clientHeight / editorLineH;
    const cssH = minimap.clientHeight;
    const lineH = getMinimapLineHeight(totalLines);
    const availH = Math.max(0, cssH - MM_PAD_Y * 2);

    const vpHeight = Math.min(cssH, Math.max(MM_VP_MIN_H, visibleLines * lineH));
    const maxFirst = Math.max(1, totalLines - visibleLines);
    const handleTravel = Math.max(1, availH - vpHeight);

    let parallax = 1 - handleTravel / (maxFirst * lineH);
    if (!isFinite(parallax)) parallax = 0.5;
    parallax = Math.max(0, Math.min(1, parallax));

    const maxContentOffset = Math.max(0, totalLines * lineH - availH);
    const firstVisibleLine = editor.scrollTop / editorLineH;
    const contentOffset = Math.min(parallax * firstVisibleLine * lineH, maxContentOffset);

    return {
      lines, editorLineH, totalLines, visibleLines, cssH, lineH, availH,
      vpHeight, maxFirst, handleTravel, parallax, maxContentOffset,
      firstVisibleLine, contentOffset
    };
  }

  function getMinimapLineColor(line) {
    const t = line.trim();
    if (!t) return null;
    if (t.startsWith('//') || t.startsWith('/*') || t.startsWith('*') || t.startsWith('<!--')) return '#4b5566';
    if (t.startsWith('</')) return '#5a8a6a';
    if (t.startsWith('<')) return '#6eb882';
    if (/^(const|let|var|function|return|if|else|for|while|class|import|export|async|await|try|catch|switch|case|break|continue|new|typeof|instanceof|this|super|throw|delete|void|do)\b/.test(t)) return '#c97a7a';
    if (t.startsWith('@')) return '#d2a8ff';
    if (/^[.#][-\w]+/.test(t)) return '#d2a8ff';
    if (t.includes('{') && t.includes(':')) return '#7a9aca';
    return '#8b949e';
  }

  function drawMinimap() {
    if (!showMinimap) return;
    const cssW = minimap.clientWidth;
    const cssH = minimap.clientHeight;
    if (cssW === 0 || cssH === 0) return;

    const m = getMinimapMetrics();
    const { lines, totalLines, lineH, contentOffset } = m;

    const dpr = window.devicePixelRatio || 1;

    minimapCanvas.width  = Math.round(cssW * dpr);
    minimapCanvas.height = Math.round(cssH * dpr);

    minimapCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    minimapCtx.clearRect(0, 0, cssW, cssH);

    const useText = lineH >= 1.6;
    if (useText) {
      minimapCtx.font = Math.max(1.2, Math.min(2.5, lineH - 0.3)) + 'px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
      minimapCtx.textBaseline = 'top';
    }

    const contentW = cssW - 4;

    const startIdx = Math.max(0, Math.floor((contentOffset - MM_PAD_Y) / lineH) - 1);

    for (let i = startIdx; i < totalLines; i++) {
      const line = lines[i];
      const color = getMinimapLineColor(line);
      if (!color) continue;

      const y = MM_PAD_Y + i * lineH - contentOffset;
      if (y + lineH < 0) continue;
      if (y > cssH) break;

      const trimmed = line.trimStart();
      if (!trimmed) continue;

      const indent = line.length - trimmed.length;
      minimapCtx.fillStyle = color;

      if (useText) {
        const x = 2 + Math.min(indent * 0.4, contentW * 0.3);
        minimapCtx.fillText(trimmed, x, y, contentW - (x - 2));
      } else {
        const indentX = Math.min(indent * 0.3, contentW * 0.3);
        const w = Math.min(trimmed.length * 0.6, contentW - indentX);
        if (w > 0.3) {
          minimapCtx.fillRect(2 + indentX, y + 0.1, w, Math.max(0.5, lineH * 0.8));
        }
      }
    }
  }

  function updateMinimapViewport() {
    if (!showMinimap) return;
    const cssH = minimap.clientHeight;
    if (cssH === 0) return;

    const m = getMinimapMetrics();

    if (m.visibleLines >= m.totalLines) {
      minimapViewport.style.top = '0px';
      minimapViewport.style.height = cssH + 'px';
      return;
    }

    const vpTop = MM_PAD_Y + (1 - m.parallax) * m.firstVisibleLine * m.lineH;
    const maxTop = cssH - m.vpHeight;

    minimapViewport.style.top    = Math.max(0, Math.min(maxTop, vpTop)) + 'px';
    minimapViewport.style.height = m.vpHeight + 'px';
  }

  function minimapYToScrollTop(clientY) {
    const m = getMinimapMetrics();
    if (m.visibleLines >= m.totalLines) return 0;

    const rect = minimap.getBoundingClientRect();
    const clickY = clientY - rect.top;
    const targetSliderTop = clickY - MM_PAD_Y - m.vpHeight / 2;
    const denom = (1 - m.parallax) * m.lineH;
    if (denom <= 0) return 0;
    const firstVisibleLine = targetSliderTop / denom;

    const clampedFirst = Math.max(0, Math.min(m.maxFirst, firstVisibleLine));
    return clampedFirst * m.editorLineH;
  }

  function toggleMinimap() {
    showMinimap = !showMinimap;
    minimap.hidden = !showMinimap;
    const btn = document.getElementById('btnMinimap');
    const check = document.getElementById('mmCheck');
    btn.setAttribute('aria-checked', String(showMinimap));
    check.hidden = !showMinimap;

    if (showMinimap) {
      requestAnimationFrame(() => {
        drawMinimap();
        updateMinimapViewport();
      });
    }
    saveAppOptions({ minimap: showMinimap });
    toast(showMinimap ? 'Minimap an' : 'Minimap aus');
  }

  document.getElementById('btnMinimap').addEventListener('click', (e) => {
    e.stopPropagation();
    toggleMinimap();
    closeAllDropdowns();
  });

  minimap.addEventListener('mousedown', (e) => {
    if (!showMinimap) return;
    e.preventDefault();
    minimapDragging = true;
    document.body.classList.add('minimap-dragging');

    const vpRect = minimapViewport.getBoundingClientRect();
    const onViewport = e.clientY >= vpRect.top && e.clientY <= vpRect.bottom;

    if (onViewport) {
      minimapDragStartY = e.clientY;
      minimapDragStartScroll = editor.scrollTop;
    } else {
      editor.scrollTop = minimapYToScrollTop(e.clientY);
      minimapDragStartY = e.clientY;
      minimapDragStartScroll = editor.scrollTop;
      syncScroll();
    }
  });

  document.addEventListener('mousemove', (e) => {
    if (!minimapDragging) return;
    const m = getMinimapMetrics();
    const dy = e.clientY - minimapDragStartY;
    const denom = (1 - m.parallax) * m.lineH;
    if (denom <= 0) return;
    editor.scrollTop = minimapDragStartScroll + (dy / denom) * m.editorLineH;
    syncScroll();
  });

  document.addEventListener('mouseup', () => {
    if (minimapDragging) {
      minimapDragging = false;
      document.body.classList.remove('minimap-dragging');
    }
  });

  minimap.addEventListener('touchstart', (e) => {
    if (!showMinimap || e.touches.length !== 1) return;
    e.preventDefault();
    minimapDragging = true;
    document.body.classList.add('minimap-dragging');
    const touch = e.touches[0];
    editor.scrollTop = minimapYToScrollTop(touch.clientY);
    minimapDragStartY = touch.clientY;
    minimapDragStartScroll = editor.scrollTop;
    syncScroll();
  }, { passive: false });

  document.addEventListener('touchmove', (e) => {
    if (!minimapDragging || e.touches.length !== 1) return;
    e.preventDefault();
    const m = getMinimapMetrics();
    const touch = e.touches[0];
    const dy = touch.clientY - minimapDragStartY;
    const denom = (1 - m.parallax) * m.lineH;
    if (denom <= 0) return;
    editor.scrollTop = minimapDragStartScroll + (dy / denom) * m.editorLineH;
    syncScroll();
  }, { passive: false });

  document.addEventListener('touchend', () => {
    if (minimapDragging) {
      minimapDragging = false;
      document.body.classList.remove('minimap-dragging');
    }
  });

  let mmResizeRaf = false;
  function scheduleMinimapResize() {
    if (mmResizeRaf) return;
    mmResizeRaf = true;
    requestAnimationFrame(() => {

  if (typeof ResizeObserver !== 'undefined') {

  const consolePanel = document.getElementById('consolePanel');

  function clearConsoleMessages() {
    consoleBody.innerHTML = '<div class="console-empty">Keine Meldungen.</div>';
  }

  function addConsoleMessage(level, args, time) {
    level = (level || 'log').toLowerCase();
    if (!['log', 'info', 'warn', 'error'].includes(level)) level = 'log';

    const empty = consoleBody.querySelector('.console-empty');
    if (empty) empty.remove();

    const msg = document.createElement('div');
    msg.className = 'console-msg level-' + level;

    const timeEl = document.createElement('span');
    timeEl.className = 'console-time';
    const d = new Date(time || Date.now());
    timeEl.textContent = d.toLocaleTimeString('de-DE', {
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    });

    const levelEl = document.createElement('span');
    levelEl.className = 'console-level';
    levelEl.textContent = level;

    const textEl = document.createElement('span');
    textEl.className = 'console-text';
    textEl.textContent = (args && args.length) ? args.join(' ') : '';

    const copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.className = 'console-copy';
    copyBtn.title = 'In Zwischenablage kopieren';
    copyBtn.setAttribute('aria-label', 'Meldung kopieren');
    copyBtn.innerHTML = '<i class="bi bi-clipboard" aria-hidden="true"></i>';
    copyBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      copyToClipboard(level.toUpperCase() + ': ' + ((args && args.length) ? args.join(' ') : ''));
    });

    msg.appendChild(timeEl);
    msg.appendChild(levelEl);
    msg.appendChild(textEl);
    msg.appendChild(copyBtn);

    const nearBottom = (consoleBody.scrollHeight - consoleBody.scrollTop - consoleBody.clientHeight) < 80;
    consoleBody.appendChild(msg);
    if (nearBottom) consoleBody.scrollTop = consoleBody.scrollHeight;

    if (level === 'error' && showPreview && !showConsole && !previewAutoOpenedConsole) {
      previewAutoOpenedConsole = true;
      toggleConsole();
    }

    while (consoleBody.children.length > 500) {
      consoleBody.removeChild(consoleBody.firstChild);
    }
  }

  async function copyToClipboard(text) {
    try {
      await navigator.clipboard.writeText(text);
      toast('Meldung kopiert');

      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.top = '-9999px';

        toast('Kopieren fehlgeschlagen');

      ta.remove();

  }

  /* =====================================================================
     Storage-Shim (Parent-Seite)
     ===================================================================== */
  const PREVIEW_STORE_KEY = 'htmleditorPreviewStore';

  const previewStorage = {
    local:   Object.create(null),
    session: Object.create(null),
    idb:     Object.create(null)
  };

  function persistPreviewStorage() {
    try {
      localStorage.setItem(PREVIEW_STORE_KEY, JSON.stringify(previewStorage));
    } catch (e) { /* quota / blockiert – ignorieren */ }
  }

  function loadPreviewStorage() {
    try {
      const raw = localStorage.getItem(PREVIEW_STORE_KEY);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') {
        previewStorage.local   = parsed.local   || Object.create(null);
        previewStorage.session = parsed.session || Object.create(null);
        previewStorage.idb     = parsed.idb     || Object.create(null);
      }
    } catch (e) { /* still */ }
  }
  loadPreviewStorage();

  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || !d.__editorStorage) return;
    if (e.source !== previewFrame.contentWindow) return;

    const reply = (result, error) => {
      try {
        previewFrame.contentWindow.postMessage({
          __editorStorageReply: true,
          nonce: d.nonce,
          id: d.id,
          result: result,
          error: error ? String(error) : null
        }, '*');
      } catch (err) { /* iframe evtl. schon weg */ }
    };

    try {
      switch (d.method) {
        case 'storage.getAll':
          reply(previewStorage[d.args[0]] || {});
          break;
        case 'storage.set':
          (previewStorage[d.args[0]] = previewStorage[d.args[0]] || Object.create(null))[d.args[1]] = d.args[2];
          persistPreviewStorage();
          reply(undefined);
          break;
        case 'storage.remove':
          if (previewStorage[d.args[0]]) delete previewStorage[d.args[0]][d.args[1]];
          persistPreviewStorage();
          reply(undefined);
          break;
        case 'storage.clear':
          previewStorage[d.args[0]] = Object.create(null);
          persistPreviewStorage();
          reply(undefined);
          break;
        case 'idb.getAll':
          reply(previewStorage.idb);
          break;
        case 'idb.setAll':
          previewStorage.idb = d.args[0] || Object.create(null);
          persistPreviewStorage();
          reply(undefined);
          break;
        default:
          reply(undefined, 'Unbekannte Methode: ' + d.method);
      }
    } catch (err) {
      reply(undefined, err && err.message ? err.message : String(err));
    }
  });

  document.getElementById('btnClearPreviewData').addEventListener('click', () => {
    previewStorage.local   = Object.create(null);
    previewStorage.session = Object.create(null);

  /* ---------- Vorschau ---------- */
  let previewNonce = 0;

  function buildPreviewSrcdoc(userHtml) {
    previewNonce++;
    const nonce = previewNonce;

    const instrumentation = getIFrameInstrumentation( nonce ); // @see iFrameInstrumentation.js
    

    const headM = /<head[^>]*>/i.exec(userHtml);
    if (headM) {
      const idx = headM.index + headM[0].length;
      return userHtml.slice(0, idx) + instrumentation + userHtml.slice(idx);
    }
    const htmlM = /<html[^>]*>/i.exec(userHtml);
    if (htmlM) {
      const idx = htmlM.index + htmlM[0].length;
      return userHtml.slice(0, idx) + '<head>' + instrumentation + '</head>' + userHtml.slice(idx);
    }
    return instrumentation + userHtml;
  }
